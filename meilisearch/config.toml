# ==============================================================================
# Meilisearch v1.48 精简配置 (2核 1GB RAM, 本地开发/低负载测试环境最佳实践)
# ==============================================================================

# 基础运行配置
db_path = "/meili_data/data.ms"
env = "development"
http_addr = "0.0.0.0:7700"

# 安全与限流 (防 OOM 关键设置)
no_analytics = true
# 限制单次上传大小，防止大 JSON 导致 Rust 内存瞬间暴涨导致 OOM
http_payload_size_limit = "10 MB"
log_level = "INFO"

# 资源分配 (2核 1GB 稳定性微调)
# 限制索引器最大内存，防止干扰查询服务或被系统 OOM-killer 强制杀死
max_indexing_memory = "256 MiB"
# 限制为 1 个线程，预留 1 个核心给 HTTP 搜索查询和系统服务，避免索引任务占满 CPU
max_indexing_threads = 1

# 备份存储路径
dump_dir = "/meili_data/dumps/"
snapshot_dir = "/meili_data/snapshots/"

# 实验性功能 (针对低内存环境的极致优化)
# 开启 LMDB MDB_WRITEMAP 写入模式，大幅降低索引时的物理内存消耗
experimental_reduce_indexing_memory_usage = true
# 限制并发批处理的任务数，防止短时间内积压大批任务导致内存超载
experimental_max_number_of_batched_tasks = 10
# 限制并发查询队列长度，避免瞬时搜索洪峰导致 OOM
experimental_search_queue_size = 100
