[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

# ==============================================================================
# 1. 输入源 (Inputs)
# ==============================================================================

# 接收来自 Docker 容器 (通过 fluentd logging driver) 发送的日志
[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

# 接收来自微服务或外部脚本的 HTTP POST JSON 日志
[INPUT]
    Name          http
    Listen        0.0.0.0
    Port          9880

# 监听应用写入挂载目录中的文件日志 (*.log)
[INPUT]
    Name          tail
    Path          /var/log/apps/**/*.log
    Path_Key      filename
    Tag           file.apps.*
    Mem_Buf_Limit 20MB
    Skip_Long_Lines On
    Refresh_Interval 10

# ==============================================================================
# 2. 过滤器 (Filters)
# ==============================================================================

# 为来自 tail 的文件日志补充默认来源标识
[FILTER]
    Name          record_modifier
    Match         file.apps.*
    Record        source file_tail

# ==============================================================================
# 3. 输出插件 (Outputs)
# ==============================================================================

# 输出至 Loki 日志聚合引擎
[OUTPUT]
    Name          loki
    Match         *
    Host          loki
    Port          3100
    Labels        job=fluent-bit
    Label_Keys    $container_name, $stream, $source, $filename
    Auto_Kubernetes_Labels off
    Line_Format   json
    Retry_Limit   5
