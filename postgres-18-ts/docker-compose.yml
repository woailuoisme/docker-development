services:
  postgres-ts:
    container_name: postgres-ts
    build:
      context: .
    restart: always
    # 扩大共享内存，保障 TimescaleDB 连续聚合与向量并发检索性能
    shm_size: 256mb
    ports:
      - "${POSTGRES_TS_PORT:-${POSTGRES_PORT:-45432}}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${DATA_PATH}postgres-ts:/var/lib/postgresql
      - ${CONFIG_PATH}postgres-18-ts/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${CONFIG_PATH}postgres-18-ts/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - backend
