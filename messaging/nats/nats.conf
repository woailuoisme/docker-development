server_name: nats-1
port: 4222
http: 8222
# JetStream
jetstream {
    store_dir: /data/jetstream
    max_memory_store: 256M
    max_file_store: 10G
}

# Authentication
authorization {
    users = [
        {
            user: $NATS_USER
            password: $NATS_PASSWORD
        }
    ]
}

# Logging
debug: false
trace: false
logtime: true
