services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:3.0.2
    container_name: 3xui
    volumes:
      - ${DATA_PATH}3xui/db/:/etc/x-ui/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "42053:2053"  #web 控制台
      - "42096:2096"  #sub 订阅
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2053/"]
      interval: 60s
      timeout: 10s
      retries: 1
    tty: true
    restart: always
    networks:
      - frontend
      - backend