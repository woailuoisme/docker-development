services:
  pgbackups:
    image: prodrigestivill/postgres-backup-local:18-alpine
    container_name: pgbackups
    restart: unless-stopped
    # 可选：按需以非 root 用户运行（需确保宿主机挂载目录具有 UID/GID 70:70 的写权限）
    # user: postgres:postgres
    depends_on:
      - postgres
    volumes:
      - ${DATA_PATH}pgbackups:/backups
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-lunchbox}
      # 可选：使用 Docker Secrets 替代环境变量传参
      # - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - POSTGRES_EXTRA_OPTS=${POSTGRES_EXTRA_OPTS:--Z1 --schema=public --blobs}
      - SCHEDULE=${PGBACKUP_SCHEDULE:-@daily}
      - BACKUP_ON_START=${PGBACKUP_ON_START:-TRUE}
      - BACKUP_KEEP_DAYS=${PGBACKUP_KEEP_DAYS:-7}
      - BACKUP_KEEP_WEEKS=${PGBACKUP_KEEP_WEEKS:-4}
      - BACKUP_KEEP_MONTHS=${PGBACKUP_KEEP_MONTHS:-6}
      - HEALTHCHECK_PORT=${PGBACKUP_HEALTHCHECK_PORT:-8080}
    networks:
      - backend
