# ==============================================================================
# PgBouncer - PostgreSQL 轻量级高性能连接池 (官方镜像)
# 官方仓库: https://github.com/pgbouncer/pgbouncer
# 官方镜像: https://hub.docker.com/r/pgbouncer/pgbouncer (1.25)
# ==============================================================================
# 【核心功能与定位】
# 1. 事务级连接复用：为 PostgreSQL 提供连接池，面向 Laravel Octane / 高并发无状态服务。
# 2. 原生环境变量驱动：通过官方镜像自带的 entrypoint 动态生成配置，无需自定义构建镜像。
# 3. 隔离网络通信：仅加入 backend 内部网络，默认不向宿主机暴露端口。
# ==============================================================================

services:
  pgbouncer:
    image: pgbouncer/pgbouncer:1.25
    container_name: pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      # 后端数据库连接与凭据
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_USER=${POSTGRES_USER:-postgres}
      - DATABASES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASES_CLIENT_SIDE_DBNAME=*
      # 连接池与运行配置
      - PGBOUNCER_LISTEN_ADDR=0.0.0.0
      - PGBOUNCER_LISTEN_PORT=6432
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=200
      - PGBOUNCER_DEFAULT_POOL_SIZE=25
      - PGBOUNCER_MIN_POOL_SIZE=5
      - PGBOUNCER_RESERVE_POOL_SIZE=5
      - PGBOUNCER_MAX_DB_CONNECTIONS=50
      - PGBOUNCER_MAX_USER_CONNECTIONS=50
      - PGBOUNCER_AUTH_TYPE=scram-sha-256
      - PGBOUNCER_ADMIN_USERS=postgres
      - PGBOUNCER_IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
    networks:
      - backend
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
