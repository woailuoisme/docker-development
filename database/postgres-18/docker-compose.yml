services:
  postgres:
    container_name: postgres
    build:
      context: .
    restart: always
    # 共享内存：需 ≥ shared_buffers (256MB)，预留余量给并行查询/超表的动态共享内存段 (DSM)
    shm_size: 512mb
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # 需要安装 TimescaleDB 的库（空格分隔）；扩展会在每个装载库常驻 scheduler 后台进程，按需声明避免空装
      - TIMESCALE_DATABASES=${TIMESCALE_DATABASES:-lunchbox}
      # 是否在首次初始化数据库时创建 IoT 售货机业务表结构（默认不初始化，按需启用）
      - ENABLE_IOT_VENDING_SCHEMA=${ENABLE_IOT_VENDING_SCHEMA:-false}
    volumes:
      - ${DATA_PATH}postgres18:/var/lib/postgresql
      - ${CONFIG_PATH}database/postgres-18/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${CONFIG_PATH}database/postgres-18/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend

