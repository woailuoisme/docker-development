services:
  pgbackrest:
    image: percona/percona-pgbackrest:2.59.0
    container_name: pgbackrest
    restart: unless-stopped
    entrypoint: ["/opt/pgbackrest/bin/backup-loop.sh"]
    environment:
      - PGBACKREST_STANZA=main
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # 备份仓库凭证 (来自 .env，不落配置文件)
      - PGBACKREST_REPO1_S3_KEY=${PGBACKREST_REPO1_S3_KEY}
      - PGBACKREST_REPO1_S3_KEY_SECRET=${PGBACKREST_REPO1_S3_KEY_SECRET}
      - PGBACKREST_REPO1_CIPHER_PASS=${PGBACKREST_REPO1_CIPHER_PASS}
      # 每日备份时刻 (容器内本地时间，随 TZ 生效)
      - PGBACKREST_BACKUP_HOUR=${PGBACKREST_BACKUP_HOUR:-3}
      # 告警：uptime-kuma push 心跳 (留空即跳过)
      - UPTIME_KUMA_PUSH_URL=${UPTIME_KUMA_PUSH_URL:-}
    volumes:
      # PostgreSQL 数据目录 bind mount (与 postgres 容器同源，只读挂载防误写)
      - ${DATA_PATH}postgres18:/var/lib/postgresql:ro
      - ./config/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./scripts:/opt/pgbackrest/bin:ro
    networks:
      - backend
