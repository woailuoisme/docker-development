[global]
# --- 备份仓库 (本机 garage 对象存储，凭证经 PGBACKREST_REPO1_S3_* 环境变量注入) ---
repo1-type=s3
repo1-s3-endpoint=garage:3900
repo1-s3-bucket=postgres-backup
repo1-s3-region=garage
repo1-path=/postgres18
repo1-s3-uri-style=path
# 静态加密 (口令经 PGBACKREST_REPO1_CIPHER_PASS 环境变量注入)
repo1-cipher-type=aes-256-cbc
# 压缩
compress-type=zst
compress-level=3
# 并行 (低配双核服务器保守取值)
process-max=2
# 保留策略：每日全量，保留 7 份
repo1-retention-full=7
# 备份前立即发起检查点，缩短备份窗口
start-fast=y

[main]
pg1-path=/var/lib/postgresql/data
