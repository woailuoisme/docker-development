services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine
    container_name: clickhouse
    restart: always
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-secret}
    volumes:
      - ${DATA_PATH}clickhouse:/var/lib/clickhouse
      - ${LOG_PATH}clickhouse:/var/log/clickhouse-server
      # 直接只读挂载调优配置目录
      - ./config.d:/etc/clickhouse-server/config.d:ro
      - ./users.d:/etc/clickhouse-server/users.d:ro
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
