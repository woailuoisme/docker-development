name: peerdb

x-minio-config: &minio-config
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: _peerdb_minioadmin
  MINIO_ROOT_USER: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: _peerdb_minioadmin
  MINIO_ROOT_PASSWORD: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://minio:9000
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket

x-catalog-config: &catalog-config
  PEERDB_CATALOG_HOST: postgres
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: ${POSTGRES_USER}
  PEERDB_CATALOG_PASSWORD: ${POSTGRES_PASSWORD}
  PEERDB_CATALOG_DATABASE: peerdb

x-flow-worker-env: &flow-worker-env
  TEMPORAL_HOST_PORT: temporal:7233
  TEMPORAL_CLIENT_CERT:
  TEMPORAL_CLIENT_KEY:
  PEERDB_TEMPORAL_NAMESPACE: default
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}

services:
  # 【必要】Temporal 工作流引擎：PeerDB 所有同步任务的调度核心（元数据存共享 postgres）
  temporal:
    image: temporalio/auto-setup:1.29
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./volumes/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - backend

  # 【必要】注册 MirrorName 搜索属性（flow-worker 依赖），并充当 temporal 就绪门禁
  temporal-admin-tools:
    image: temporalio/admin-tools:1.25
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    entrypoint: /etc/temporal/entrypoint.sh
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ./scripts/mirror-name-search.sh:/etc/temporal/entrypoint.sh
    networks:
      - backend

  # 【可选】Temporal Web 管理界面：查看工作流运行状态与重试/报错详情
  temporal-ui:
    image: temporalio/ui:2.54.1
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
    ports:
      - "8085:8080"
    networks:
      - backend

  # 【必要·一次性】在共享 postgres 的 peerdb 库中建表迁移，跑完即退出
  flow-migrate:
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.10
    entrypoint: ["/home/peerdb/peer-flow", "migrate"]
    environment:
      <<: *catalog-config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # 【必要】API 服务端：接收 UI/CLI 的镜像创建与管理请求，并向 temporal 提交工作流
  flow-api:
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.10
    restart: unless-stopped
    ports:
      - "8112:8112" # gRPC API（CLI 用）
    environment:
      <<: [*catalog-config, *flow-worker-env, *minio-config]
      PEERDB_ALLOWED_TARGETS:
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
      temporal-admin-tools:
        condition: service_healthy
    networks:
      - backend

  # 【必要】初始快照 Worker：同步启动时先把源表全量搬进目标库
  flow-snapshot-worker:
    image: ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.37.10
    restart: unless-stopped
    environment:
      <<: [*catalog-config, *flow-worker-env, *minio-config]
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
      temporal-admin-tools:
        condition: service_healthy
    networks:
      - backend

  # 【必要】CDC Worker：快照完成后持续消费变更日志做增量同步
  flow-worker:
    image: ghcr.io/peerdb-io/flow-worker:stable-v0.37.10
    restart: unless-stopped
    environment:
      <<: [*catalog-config, *flow-worker-env, *minio-config]
    extra_hosts:
      - "host.docker.internal:host-gateway" # 镜像源为宿主机数据库时使用
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
      temporal-admin-tools:
        condition: service_healthy
    networks:
      - backend

  # 【必要】PeerDB gRPC 服务端：peer CLI 的对接入口（读写 catalog 元数据）
  peerdb:
    image: ghcr.io/peerdb-io/peerdb-server:stable-v0.37.10
    stop_signal: SIGINT
    restart: unless-stopped
    ports:
      - "9900:9900" # gRPC（CLI 用）
    environment:
      <<: *catalog-config
      PEERDB_PASSWORD:
      PEERDB_FLOW_SERVER_ADDRESS: grpc://flow-api:8112
      PEERDB_MIGRATIONS_DISABLED: true
      RUST_LOG: info
      RUST_BACKTRACE: 1
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
    networks:
      - backend

  # 【可选】PeerDB Web 控制台：可视化管理镜像与查看同步状态（纯 CLI 也可）
  peerdb-ui:
    image: ghcr.io/peerdb-io/peerdb-ui:stable-v0.37.10
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *catalog-config
      PEERDB_FLOW_SERVER_HTTP: http://flow-api:8113
      NEXTAUTH_SECRET: __changeme__
      NEXTAUTH_URL: http://localhost:3000
      PEERDB_ALLOWED_TARGETS:
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS:
      PEERDB_EXPERIMENTAL_ENABLE_SCRIPTING: true
    depends_on:
      - flow-api
    networks:
      - backend

  # 【必要】S3 暂存桶：ClickHouse 目标与大批量数据的落盘中转（自动建桶）
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    environment:
      <<: *minio-config
    entrypoint: >
      /bin/sh -c "
      silo server /data --console-address=:36987 &
      sleep 2;
      mc alias set myminiopeerdb http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing myminiopeerdb/$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME;
      wait
      "
    volumes:
      - minio-data:/data
    networks:
      - backend

volumes:
  minio-data:

networks:
  backend:
    external: true
    name: backend
