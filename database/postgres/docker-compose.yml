services:
  postgres:
    container_name: postgres
    build:
      context: .
    restart: always
    # 共享内存：预留给 shared_buffers (256MB) 与并行查询/动态共享内存段 (DSM)
    shm_size: 512mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # Barman Cloud S3 持续归档与物理备份配置 (默认 false 防止未起 S3 时 WAL 堆积)
      - BARMAN_CLOUD_ENABLED=${BARMAN_CLOUD_ENABLED:-false}
      - BARMAN_CLOUD_S3_ENDPOINT=http://garage:3900
      - BARMAN_CLOUD_BUCKET=${BARMAN_CLOUD_BUCKET:-postgres-backups}
      - BARMAN_CLOUD_SERVER_NAME=postgres18
      - AWS_ACCESS_KEY_ID=${GARAGE_DEFAULT_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      - AWS_DEFAULT_REGION=garage
    volumes:
      - ${DATA_PATH}postgres18:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - backend
