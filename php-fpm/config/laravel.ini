; ============================================================================
; PHP-FPM / Laravel 汇总配置
; ============================================================================

; ============================================================================
; 核心与基础配置
; ============================================================================

; 设置默认时区
date.timezone = Asia/Shanghai

; 设置默认字符集
default_charset = "UTF-8"

; 设置 PHP 变量注册顺序（EGPCS: Environment, Get, Post, Cookie, Server）
; 必须包含 'E' 才能在 $_ENV 中读取环境变量
variables_order = "EGPCS"

; ============================================================================
; 错误处理与日志
; ============================================================================

; 关闭错误显示（生产/容器环境安全设置）
display_errors = Off
display_startup_errors = Off

; 开启错误日志记录
log_errors = On

; 错误日志输出到标准错误流（便于 Docker 日志收集）
error_log = /proc/self/fd/2

; 错误报告级别
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 自定义访问日志格式
access.format = "%R - %{%F %T}t %s %ds \"%m %r\" %MMB"

; ============================================================================
; 内存与执行超时配置
; ============================================================================

; PHP 内存限制
memory_limit = 256M

; 上传文件大小限制
upload_max_filesize = 50M

; POST 数据大小限制
post_max_size = 60M

; 最大执行时间（秒）
max_execution_time = 600

; 默认 Socket 超时时间（秒）
default_socket_timeout = 3600

; 请求终止超时时间
request_terminate_timeout = 600s

; ============================================================================
; OPcache 字节码缓存配置 (PHP-FPM)
; ============================================================================

[opcache]

; 启用 OPcache
opcache.enable = 1

; 禁用 CLI 模式的 OPcache
opcache.enable_cli = 0

; JIT 配置（禁用以兼容 XDebug）
opcache.jit = disable

; 内存与文件数量配置

; OPcache 共享内存大小（MB，用于存储编译后的字节码）
opcache.memory_consumption = 256

; 驻留字符串缓冲区大小（MB，用于存储常量字符串、类名及属性名）
opcache.interned_strings_buffer = 16

; 最大缓存脚本文件数量（设置需大于项目包含的 PHP 文件总数，避免哈希碰撞）
opcache.max_accelerated_files = 30000

; 允许缓存的单文件最大字节数（0 为不限制）
opcache.max_file_size = 0

; 开发环境关键配置 - 文件修改检测

; 是否验证脚本时间戳（1: 开启，开发模式下确保代码修改能实时更新）
opcache.validate_timestamps = 1

; 检查脚本时间戳更新频率（单位：秒，开发环境建议 1-2 秒以平衡实时性与 I/O 性能）
opcache.revalidate_freq = 2


; 优化与特性配置（开发/诊断调优）

; 禁用文件覆盖检查（开发模式下避免 file_exists 等系统调用结果被缓存干扰）
opcache.enable_file_override = 0

; 启用快速关闭序列（请求结束时不逐个释放内存，交由内存管理器批量回收）
opcache.fast_shutdown = 1

; 开启文件缓存一致性检查（校验缓存完整性，防止文件损坏）
opcache.file_cache_consistency_checks = 1

; 日志详细级别（1: 记录错误与警告日志，便于开发诊断与排查未命中）
opcache.log_verbosity_level = 1

; 记录 OPcache 警告信息
opcache.record_warnings = 1

; 在缓存键中包含工作目录（防止不同路径下同名文件产生缓存冲突）
opcache.use_cwd = 1

; 内存浪费比例限制（超出 5% 时触发 OPcache 自动重启）
opcache.max_wasted_percentage = 5


; 框架兼容性 (Laravel 保留文档注释)
opcache.save_comments = 1
opcache.load_comments = 1

; ============================================================================
; MySQL (MySQLi / PDO_MySQL / MySQLnd)
; ============================================================================

[mysqli]
; 禁用驱动级持久连接以防止连接泄露
mysqli.allow_persistent = Off

[mysqlnd]
; 禁用统计信息收集以减少开销
mysqlnd.collect_statistics = Off

; ============================================================================
; PostgreSQL (PgSQL)
; ============================================================================

[PostgreSQL]
; 关闭驱动级持久连接
pgsql.allow_persistent = Off
; 自动重连
pgsql.auto_reset_persistent = On
; 忽略 Notice 消息
pgsql.ignore_notice = 1

; ============================================================================
; Redis (PhpRedis)
; ============================================================================

[redis]
; 开启连接池
redis.pconnect.pooling_enabled = On
redis.pconnect.connection_limit = -1
; 开启存活性检查
redis.pconnect.echo_check_liveness = On

; ============================================================================
; AMQP (RabbitMQ)
; ============================================================================

[amqp]
; 显式设置超时以防止网络僵死（秒）
amqp.connect_timeout = 10
amqp.read_timeout = 30
amqp.write_timeout = 30
; 心跳维持长连接活性（秒）
amqp.heartbeat = 60
