# docker run --rm ghcr.io/getarcaneapp/arcane:latest /app/arcane generate secret
# default username: arcane password: arcane-admin
services:
  arcane:
    container_name: arcane
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ARCANE_VERSION=v1.15.3
    ports:
      - '3552:3552'
    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}arcane:/app/data
      - ${CONFIG_PATH}arcane/projects:/app/data/projects
    restart: unless-stopped
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - ENCRYPTION_KEY=TtQR8Lsn8ltqxC8OeUD127FsVvg7fW2GihUzSnBO/zQ=
      - JWT_SECRET=Gx2/hJ/i9YUgNBcvsuN5tccDkd3BOKFfRJd9XWpkSoM=
    depends_on:
      - docker-socket-proxy
    networks:
      - frontend
      - backend


