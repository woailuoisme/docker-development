# ==============================================================================
# Fail2ban Filter: Caddy 漏洞扫描器与恶意探测过滤器 (caddy-scanner)
# ==============================================================================
# 支持解析 Caddy 标准 JSON 访问日志 (/srv/logs/access.log) 及通用 Combined 格式日志。
# 重点拦截敏感文件嗅探 (.env, .git, .aws, .ssh)、常见漏洞利用 (phpmyadmin, wp-login, 路径穿越) 及异常状态码。

[INCLUDES]
before = common.conf

[Definition]

# failregex 匹配规则：
# 1. 匹配 Caddy JSON 日志中对高危敏感路径与后门路径的探测 (无论状态码)
# 2. 匹配 Caddy JSON 日志中多次触发 401 Unauthorized / 403 Forbidden / 404 Not Found 的 IP
# 3. 兼容传统 Nginx / Caddy console 格式日志中的敏感路径探测
failregex = ^\{.*"remote_ip":"<HOST>".*"uri":"[^"]*(\.env|\.git|\.aws|\.ssh|\.docker|wp-login\.php|wp-admin|phpmyadmin|pma|eval\(|\.\./|actuator|console|api/v1/auth).*".*\}$
            ^\{.*"remote_ip":"<HOST>".*"status":(401|403|404).*\}$
            ^<HOST> - .* "(GET|POST|HEAD) [^"]*(\.env|\.git|\.aws|\.ssh|\.docker|wp-login\.php|wp-admin|phpmyadmin|\.\./|actuator).* HTTP/\d\.\d" (400|401|403|404)

ignoreregex = ^\{.*"remote_ip":"<HOST>".*"uri":"[^"]*(favicon\.ico|robots\.txt|apple-touch-icon\.png).*".*\}$

# 日志匹配日期格式定义 (适配 ISO8601 与 Caddy 时间戳)
datepattern = "ts":{EPOCH}
              "ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?(?:Z|[+-]%%H:?%%M)?"
              ^%%Y-%%m-%%d %%H:%%M:%%S
