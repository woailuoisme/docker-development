; ==============================================================================
; Laravel 13 + PHP 8.5 生产环境 FPM INI 配置
; ==============================================================================

[PHP]
; 基础与时区
date.timezone = Asia/Shanghai
default_charset = "UTF-8"
; 必须包含 'E'，确保 Docker 容器内通过 $_ENV 读取环境变量
variables_order = "EGPCS"
expose_php = Off

; 核心：生产环境开启零成本断言（完全不编译断言代码，彻底消除 CPU 损耗）
zend.assertions = -1

; 错误日志：关闭终端回显，标准错误流输出至 Docker 收集器
; 生产环境排除 Deprecated/Notice/Strict，防止 PHP 8.5 大量废弃警告阻塞 stderr 管道引起 I/O 卡顿
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
; 禁用 FastCGI 协议向 Web 服务器投递 stderr，统一由 FPM 收集器直接输出至 /proc/self/fd/2
fastcgi.logging = 0

; 内存与超时控制（FPM Web 请求限制）
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
default_socket_timeout = 60

; 文件上传（必须保证 post_max_size >= upload_max_filesize）
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; 路径解析缓存（减少系统磁盘 stat 调用）
realpath_cache_size = 8M
realpath_cache_ttl = 3600

; Session 安全优化
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; ==============================================================================
; OPcache 生产优化（PHP-FPM 核心）
; ==============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 0

; 内存与文件量（65407 为标准质数，避免哈希冲突）
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 65407

; 生产环境彻底关闭文件变更检查（代码更新时直接重启容器）
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; 框架强依赖：必须开启以保留 Laravel 属性注解（Attributes）与反射信息
opcache.save_comments = 1

; FPM 生产环境下关闭时间戳检查后开启 file_override，加速 file_exists/is_file
opcache.enable_file_override = 1

; 核心：开启 JIT
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ==============================================================================
; 数据持久化与连接池规范
; ==============================================================================
[mysqli]
mysqli.allow_persistent = Off

[mysqlnd]
mysqlnd.collect_statistics = Off

[PostgreSQL]
pgsql.allow_persistent = Off
pgsql.auto_reset_persistent = On
pgsql.ignore_notice = 1

[redis]
; PhpRedis 扩展级长连接配置
redis.pconnect.pooling_enabled = 1
redis.pconnect.connection_limit = 0
; 核心：关闭 echo_check_liveness，杜绝每次操作 Redis 前额外的 ECHO/PING 网络往返开销
redis.pconnect.echo_check_liveness = 0

[amqp]
; RabbitMQ 网络超时与心跳保活
amqp.connect_timeout = 10
amqp.read_timeout = 30
amqp.write_timeout = 30
amqp.heartbeat = 60
