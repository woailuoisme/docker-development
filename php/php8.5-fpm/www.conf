; ==============================================================================
; Laravel 13 + PHP 8.5 生产环境 FPM 进程池配置 (Pool: www)
; ==============================================================================

[global]
; 前台运行（Docker 容器核心要求）
daemonize = no
; 错误日志输出至标准错误流（Docker 收集器）
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; 运行用户与组
user = www-data
group = www-data

; 网络监听地址与端口
listen = 0.0.0.0:9000

; ==============================================================================
; 进程管理优化（容器化推荐静态进程池 static，消除进程频繁 fork 开销并杜绝 OOM 突发风险）
; 计算公式：pm.max_children ≈ (容器内存上限 - 系统预留 256MB) / 单 Worker 平均内存 (约 70MB)
; 示例：2GB 容器配额 => (2048 - 256) / 70 ≈ 25
; ==============================================================================
pm = static
; 容器固定分配子进程数（按 1.5G~2G 容器推荐默认 20，可依据实际容器 limit 调整）
pm.max_children = 20
; 每个子进程处理指定请求后平滑重启，彻底杜绝 PHP 内存泄漏
pm.max_requests = 1000

; ==============================================================================
; 请求超时与慢日志
; ==============================================================================
; 单个请求最大执行超时（与 laravel.ini 中 max_execution_time 保持一致）
request_terminate_timeout = 60s
; 慢请求追踪（超过 5 秒记录慢调用栈）
request_slowlog_timeout = 5s
slowlog = /var/log/php/fpm.slow.log

; ==============================================================================
; 健康检查与状态监控
; ==============================================================================
; Kubernetes / 负载均衡存活探针
ping.path = /ping
ping.response = pong
; FPM 状态监控路径
pm.status_path = /status

; ==============================================================================
; 日志与容器环境变量捕获
; ==============================================================================
; 生产环境推荐关闭 FPM 访问日志，由上层网关（Caddy/Nginx）统一记录，避免污染 stderr 与产生双重 I/O
; 如需排查 FastCGI 传输层问题，可取消注释并输出至 stdout (/proc/self/fd/1)
; access.log = /proc/self/fd/1
; access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}Mkb %C%%"

; 捕获 Worker 进程的标准输出与标准错误
catch_workers_output = yes
; 关闭 Worker 输出修饰，防止 Docker 日志行被截断或多重前缀
decorate_workers_output = no

; 核心：禁止清空环境变量，确保 Laravel 能在 FPM 下正常读取 Docker 环境变量
clear_env = no

; 限制可解析执行的文件扩展名，增强安全性
security.limit_extensions = .php
