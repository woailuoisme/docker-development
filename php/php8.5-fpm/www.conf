; ==============================================================================
; Laravel 13 + PHP 8.5 生产环境 FPM 进程池配置 (Pool: www)
; ==============================================================================

[global]
; 前台运行（Docker 容器核心要求）
daemonize = no
; 错误日志输出至标准错误流（Docker 收集器）
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; 运行用户与组
user = www-data
group = www-data

; 网络监听地址与端口
listen = 0.0.0.0:9000

; ==============================================================================
; 进程管理优化（动态管理模式）
; ==============================================================================
pm = dynamic
; 同时运行的最大子进程数（根据生产服务器资源调整）
pm.max_children = 50
; 启动时创建的子进程数
pm.start_servers = 5
; 保证的最少空闲子进程数
pm.min_spare_servers = 5
; 允许的最大空闲子进程数
pm.max_spare_servers = 15
; 空闲进程超时时间（秒）
pm.process_idle_timeout = 10s
; 每个子进程处理指定请求后平滑重启，彻底杜绝 PHP 内存泄漏
pm.max_requests = 1000

; ==============================================================================
; 请求超时与慢日志
; ==============================================================================
; 单个请求最大执行超时（与 laravel.ini 中 max_execution_time 保持一致）
request_terminate_timeout = 60s
; 慢请求追踪（超过 5 秒记录慢调用栈）
request_slowlog_timeout = 5s
slowlog = /var/log/php/fpm.slow.log

; ==============================================================================
; 健康检查与状态监控
; ==============================================================================
; Kubernetes / 负载均衡存活探针
ping.path = /ping
ping.response = pong
; FPM 状态监控路径
pm.status_path = /status

; ==============================================================================
; 日志与容器环境变量捕获
; ==============================================================================
; 访问日志输出至 stderr
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}Mkb %C%%"

; 捕获 Worker 进程的标准输出与标准错误
catch_workers_output = yes
; 关闭 Worker 输出修饰，防止 Docker 日志行被截断或多重前缀
decorate_workers_output = no

; 核心：禁止清空环境变量，确保 Laravel 能在 FPM 下正常读取 Docker 环境变量
clear_env = no

; 限制可解析执行的文件扩展名，增强安全性
security.limit_extensions = .php
