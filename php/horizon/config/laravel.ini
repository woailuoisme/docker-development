; ==============================================================================
; Laravel 13 + PHP 8.5 生产环境通用 INI（Octane / Horizon / Schedule 并集）
; ==============================================================================

[PHP]
; 基础与时区
date.timezone = Asia/Shanghai
default_charset = "UTF-8"
; 必须包含 'E'，确保 Docker 容器内通过 $_ENV 读取环境变量
variables_order = "EGPCS"
expose_php = Off

; 错误日志：关闭终端回显，标准错误流输出至 Docker 收集器
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; 内存与超时控制（取并集安全值）
memory_limit = 512M
; CLI 模式设为 0（不限时）。Octane 由 RoadRunner 控制超时，Horizon 由 Job 配置控制超时
max_execution_time = 0
default_socket_timeout = 60

; 文件上传（并集上限，必须保证 post_max_size >= upload_max_filesize）
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; 路径解析缓存（常驻内存服务优化，减少系统磁盘 stat 调用）
realpath_cache_size = 8M
realpath_cache_ttl = 3600

; ==============================================================================
; OPcache 生产优化（Octane / CLI 核心）
; ==============================================================================
[opcache]
opcache.enable = 1
; 核心：RoadRunner / Horizon / Schedule 均为 CLI 运行，必须开启 enable_cli
opcache.enable_cli = 1

; 内存与文件量（65407 为标准质数，避免哈希冲突）
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 65407

; 生产环境彻底关闭文件变更检查（代码更新时直接重启容器）
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; 框架强依赖：必须开启以保留 Laravel 属性注解（Attributes）与反射信息
opcache.save_comments = 1
opcache.enable_file_override = 1

; JIT 配置：I/O 密集型 Web/Worker 默认关闭可获得更高稳定性与更少内存消耗
; 如需开启 CPU 密集计算可设为 tracing 并分配 64M~128M
opcache.jit = disable
opcache.jit_buffer_size = 0

; ==============================================================================
; 数据持久化与连接池规范
; ==============================================================================
[mysqli]
; 常驻内存模式下禁用驱动级持久连接，由 Laravel 生命周期管理器维护连接
mysqli.allow_persistent = Off

[mysqlnd]
mysqlnd.collect_statistics = Off

[PostgreSQL]
pgsql.allow_persistent = Off
pgsql.auto_reset_persistent = On
pgsql.ignore_notice = 1

[redis]
; PhpRedis 扩展级连接池与健康探针（防超时断开后报 Connection lost）
redis.pconnect.pooling_enabled = 1
redis.pconnect.connection_limit = 30
redis.pconnect.echo_check_liveness = 1

[amqp]
; RabbitMQ 网络超时与心跳保活
amqp.connect_timeout = 10
amqp.read_timeout = 30
amqp.write_timeout = 30
amqp.heartbeat = 60
