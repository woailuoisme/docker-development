; PHP 8.6 生产环境 FPM 进程池配置 (Pool: www)

[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; 固定高 UID/GID 专用用户 (10001:10001)
user = app
group = app

listen = 0.0.0.0:9000

; 静态进程池，消除频繁 fork 开销并防止 OOM（按单 Worker ~70MB 估算）
pm = static
pm.max_children = 20
pm.max_requests = 1000

; 请求超时与慢日志
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php/fpm.slow.log

; 健康检查与状态监控
ping.path = /ping
ping.response = pong
pm.status_path = /status

; 捕获 Worker 输出至容器日志，保留环境变量供应用读取
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
