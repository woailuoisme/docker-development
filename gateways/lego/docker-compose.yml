services:
  lego:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lego
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - DOMAIN=${SITE_ADDRESS:-test.local}
      - EMAIL=${LEGO_EMAIL:-admin@${SITE_ADDRESS:-example.com}}
      - DNS_PROVIDER=${LEGO_DNS_PROVIDER:-cloudflare}
      - LEGO_CA_STAGING=${LEGO_CA_STAGING:-false}
      - LEGO_KEY_TYPE=${LEGO_KEY_TYPE:-ec256}
      - LEGO_RENEW_INTERVAL=${LEGO_RENEW_INTERVAL:-43200}
      - RELOAD_CONTAINER=${LEGO_RELOAD_CONTAINER:-nginx}
      # Cloudflare DNS 凭据 (Lego 推荐官方变量)
      - CF_DNS_API_TOKEN=${CF_API_TOKEN:-}
      # 阿里云 DNS 凭据 (Lego 推荐官方变量)
      - ALICLOUD_ACCESS_KEY=${ALIYUN_ACCESS_KEY_ID:-}
      - ALICLOUD_SECRET_KEY=${ALIYUN_ACCESS_KEY_SECRET:-}
      # 腾讯云凭据
      - TENCENTCLOUD_SECRET_ID=${TENCENTCLOUD_SECRET_ID:-}
      - TENCENTCLOUD_SECRET_KEY=${TENCENTCLOUD_SECRET_KEY:-}
    volumes:
      - ${DATA_PATH}lego:/.lego
      - ${DATA_PATH}ssl:/ssl
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - backend
