services:
  haproxy:
    container_name: haproxy
    build:
      context: .
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-test.local}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - HAPROXY_STATS_USER=${HAPROXY_STATS_USER:-admin}
      - HAPROXY_STATS_PASSWORD=${HAPROXY_STATS_PASSWORD:-admin}
    volumes:
      - ${CONFIG_PATH}gateways/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${CONFIG_PATH}gateways/haproxy/conf.d:/usr/local/etc/haproxy/conf.d:ro
      - ${CONFIG_PATH}gateways/haproxy/maps:/usr/local/etc/haproxy/maps:ro
      - ${DATA_PATH}ssl:/etc/haproxy/ssl:ro
      - ${DATA_PATH}haproxy/certs:/etc/haproxy/certs
      - ${DATA_PATH}haproxy:/var/lib/haproxy
    ports:
      - "${HAPROXY_PORT:-80}:80"
      - "${HAPROXY_SSL_PORT:-443}:443"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    networks:
      - frontend
      - backend
