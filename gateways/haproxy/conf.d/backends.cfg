# ==============================================================================
# HAProxy 业务后端配置 (Modular Backends)
# 类似 Nginx 的 conf.d/*.conf，可将不同服务拆分至本目录下的各个 .cfg 文件
# 所有配置文件均支持环境变量占位符替换，如 ${SITE_ADDRESS}
# ==============================================================================

# Laravel / PHP 高性能应用集群 (Octane / RoadRunner / FrankenPHP)
backend be_octane
    mode http
    balance roundrobin
    server octane1 php-roadrunner:8001 check resolvers docker init-addr libc,none
