# WAF (Web 应用防护) 规则
# 使用方式：在 server {} 块中 include snippets/waf.conf;

# --------------------------------------------
# 1. 恶意 User-Agent 扫描工具防护
# --------------------------------------------
if ($http_user_agent ~* "sqlmap|nmap|nikto|acunetix|dirbuster|masscan|nuclei|gobuster|burpsuite|wfuzz|ffuf|zgrab|censys|shodan") {
    return 403 "403 Forbidden - Malicious Bot detected";
}

# --------------------------------------------
# 2. 禁用非法 HTTP 请求方法
# --------------------------------------------
if ($request_method ~ "^(TRACE|TRACK|DEBUG|CONNECT)$") {
    return 405 "405 Method Not Allowed";
}

# --------------------------------------------
# 3. 敏感文件访问防护
# --------------------------------------------
location ~* "(\.env.*|\.git|\.svn|\.sql|\.bak|\.log|\.config|\.htaccess|\.htpasswd|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Dockerfile|\.dockerignore|artisan|server\.php|wp-config\.php|.*\.sql(\.gz)?|\.old|\.backup|\.tmp|\.idea|\.vscode|\.pem|\.key|\.crt|\.nginx\.conf|web\.conf)" {
    deny all;
    access_log off;
    log_not_found off;
    return 403 "403 Forbidden - Sensitive File Access Denied";
}

# --------------------------------------------
# 4. 路径遍历与系统文件防护
# --------------------------------------------
if ($query_string ~* "(etc/passwd|etc/shadow|bin/sh|bin/bash|cmd\.exe|powershell|\.\./)") {
    return 403 "403 Forbidden - Path Traversal Blocked";
}
location ~* "(etc/passwd|etc/shadow|bin/sh|bin/bash|cmd\.exe|powershell|\.\./)" {
    deny all;
    access_log off;
    log_not_found off;
    return 403 "403 Forbidden - Path Traversal Blocked";
}

# --------------------------------------------
# 5. SQL 注入攻击防护
# --------------------------------------------
if ($query_string ~* "(union.*select|insert.*into|delete.*from|drop.*(table|database)|select.*from)") {
    return 403 "403 Forbidden - SQL Injection Blocked";
}
location ~* "(union.*select|insert.*into|delete.*from|drop.*(table|database)|select.*from)" {
    deny all;
    access_log off;
    log_not_found off;
    return 403 "403 Forbidden - SQL Injection Blocked";
}

# --------------------------------------------
# 6. XSS 跨站脚本攻击防护
# --------------------------------------------
if ($query_string ~* "(<script|javascript:|on[a-z]+\s*=)") {
    return 403 "403 Forbidden - XSS Attempt Blocked";
}
location ~* "(<script|javascript:|on[a-z]+\s*=)" {
    deny all;
    access_log off;
    log_not_found off;
    return 403 "403 Forbidden - XSS Attempt Blocked";
}

# --------------------------------------------
# 7. 文件包含攻击防护 (LFI/RFI)
# --------------------------------------------
if ($query_string ~* "(file:|php:|data:|expect:|zip:|phar:|glob:|dict:|gopher:|ldap:|http:|https:|ftp:)") {
    return 403 "403 Forbidden - File Inclusion Blocked";
}
location ~* "(file:|php:|data:|expect:|zip:|phar:|glob:|dict:|gopher:|ldap:|http:|https:|ftp:)" {
    deny all;
    access_log off;
    log_not_found off;
    return 403 "403 Forbidden - File Inclusion Blocked";
}

# --------------------------------------------
# 8. Log4Shell / JNDI 注入防护
# --------------------------------------------
if ($query_string ~* "(\\\$\\{jndi:|\\\$\\{java:|\\\$\\{env:|\\\$\\{sys:|%24%7Bjndi)") {
    return 403 "403 Forbidden - Log4Shell Blocked";
}
location ~* "(\\\$\\{jndi:|\\\$\\{java:|\\\$\\{env:|\\\$\\{sys:|%24%7Bjndi)" {
    deny all;
    access_log off;
    log_not_found off;
    return 403 "403 Forbidden - Log4Shell Blocked";
}

# --------------------------------------------
# 9. 隐蔽管理后台路径拦截 (对外伪装返回 404)
# --------------------------------------------
location ~* "^\/(phpmyadmin|adminer|wp-admin|wp-login|administrator|manager|console|phpinfo)" {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}
