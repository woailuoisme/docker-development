user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 20480;
    multi_accept on;
    use epoll;
    accept_mutex off; # reuseport 开启下关闭互斥锁以提升性能
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    include snippets/security-headers.conf;

    # 日志时间格式优化 (格式化为 YYYY-MM-DD HH:MM:SS，移除 T 与时区)
    map $time_iso8601 $custom_time {
        default "${time_iso8601}";
        ~^([^T]+)T([^+-]+) "$1 $2";
    }

    log_format main '[$custom_time] [$remote_addr] "$request" '
                    '$status ${request_time}s $body_bytes_sent "$http_user_agent"';

    # 基础 I/O 优化
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Gzip 压缩配置
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 本地性能测试服务器
    include default.conf;
}
