# ==============================================================================
# Traefik v3 TLS 安全选项与证书动态配置 (TLS & Certificates)
# ==============================================================================

tls:
  # --------------------------------------------------------------------------
  # 默认 TLS 安全协议策略 (现代安全加密套件)
  # --------------------------------------------------------------------------
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: false

  # --------------------------------------------------------------------------
  # 静态证书加载 (支持 Go 模板变量语法渲染环境域名)
  # 默认挂载于 /etc/traefik/certs/ (${CONFIG_PATH}gateways/certbot/conf)
  # --------------------------------------------------------------------------
  # certificates:
  #   - certFile: "/etc/traefik/certs/live/{{ env \"SITE_ADDRESS\" }}/fullchain.pem"
  #     keyFile: "/etc/traefik/certs/live/{{ env \"SITE_ADDRESS\" }}/privkey.pem"
  #     stores:
  #       - default
