services:
  mkcert:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mkcert
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-test.local}
      - DOMAINS=${DOMAINS:-}
    volumes:
      # 持久化 CA 根证书与私钥，避免重复生成 CA 导致系统钥匙串频繁信任失效
      - ${DATA_PATH}mkcert/caroot:/root/.local/share/mkcert
      # 输出证书与 CA 到统一 ssl 目录 (对齐 lego 与 nginx 挂载规范)
      - ${DATA_PATH}ssl:/ssl
    restart: "no"
    networks:
      - backend

