services:
  netbird:
    image: netbirdio/netbird:0.82.1
    container_name: netbird
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - NB_SETUP_KEY=${NETBIRD_SETUP_KEY}
    volumes:
      - ${DATA_PATH}netbird:/var/lib/netbird
    networks:
      - backend
