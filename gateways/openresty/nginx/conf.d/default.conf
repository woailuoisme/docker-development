# 默认虚拟主机配置
server {
    listen 80;
    listen [::]:80;
    server_name haoxiaoguai.xyz www.haoxiaoguai.xyz;

    # HTTP 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # ACME 验证目录 (如果需要 http-01 验证，虽然我们用的是 dns-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    
    http2 on;
    # 开启 HTTP/3 (QUIC)
    http3 on;
    http3_hq on; # 兼容性支持
    quic_retry on;

    server_name haoxiaoguai.xyz www.haoxiaoguai.xyz;

    # 告知浏览器支持 HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header QUIC-Status $quic; # 可选：在响应头显示 QUIC 状态

    # 1. 优先使用 acme 服务生成的静态证书 (如果存在)
    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/privkey.pem;

    # 2. 如果静态证书不存在或不匹配，由 auto-ssl 动态处理握手
    # 注意：ssl_certificate_by_lua 只有在没有匹配到静态证书时才会被调用（或者作为补充）
    # 在 auto-ssl 模式下，通常我们会使用自签名证书占位，真正的证书由 Lua 动态注入
    ssl_certificate_by_lua_block {
        auto_ssl:ssl_certificate()
    }

    # 动态功能集成
    # 1. 动态 WAF (访问阶段执行)
    access_by_lua_file /usr/local/openresty/nginx/lua/waf.lua;

    # 2. 灰度发布 (重写阶段执行)
    set $ups_target "";
    rewrite_by_lua_file /usr/local/openresty/nginx/lua/gray.lua;

    # 根目录
    root /usr/local/openresty/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # 错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/local/openresty/nginx/html;
    }
}
