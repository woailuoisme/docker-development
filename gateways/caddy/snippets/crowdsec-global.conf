# ==============================================================================
# CrowdSec HTTP Bouncer 全局配置 (CrowdSec Global Settings)
#
# 在 Caddyfile 全局选项块中引入:
# import snippets/crowdsec-global.conf
# ==============================================================================
order crowdsec before coraza_waf

crowdsec {
	api_url http://crowdsec:8080
	api_key {$CROWDSEC_BOUNCER_KEY_CADDY:crowdsec-caddy-bouncer-dev-secret-key-32ch}
	ticker_interval 15s
}
