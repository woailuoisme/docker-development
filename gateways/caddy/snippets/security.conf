# ============================================================================
# security.conf - Caddy 安全头配置片段
# ============================================================================
# - 优化提升 Web 应用的防护等级，防范常见劫持及注入攻击
# - 遵循 modern Web 安全最佳实践 (OWASP)
# ============================================================================

header {
	# Referrer-Policy: 跨源请求仅发送源（协议+域名+端口），防敏感 URL 泄露
	Referrer-Policy "strict-origin-when-cross-origin"

	# Strict-Transport-Security (HSTS): 强制浏览器在未来一年内使用 HTTPS
	Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

	# X-Xss-Protection: 显式关闭旧版浏览器 XSS 过滤机制，避免侧信道攻击风险 (现代浏览器依靠 CSP)
	X-Xss-Protection "0"

	# X-Content-Type-Options: 禁用 MIME 类型嗅探，防止将文本文件误执行为脚本
	X-Content-Type-Options "nosniff"

	# X-Frame-Options: 限制页面仅在同源 iframe 内嵌入，抵御点击劫持
	X-Frame-Options "SAMEORIGIN"

	# Content-Security-Policy (CSP): 强制升级不安全的 HTTP 资源请求为 HTTPS
	Content-Security-Policy "upgrade-insecure-requests"

	# 移除敏感的服务器指纹及底层框架响应头，减少信息暴露面
	-Server
	-X-Powered-By
	-Via
}
