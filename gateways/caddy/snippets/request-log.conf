# 1. 终端控制台输出 (格式化，便于 docker logs / dozzle 实时查看)
log {
	output stdout
	level INFO
	format transform `{ts} [{level}] "{request>remote_ip} {status} {duration} {request>proto} {request>method} {request>host}{request>uri} {size}" "{request>headers>Referer>[0]}" "{request>headers>User-Agent>[0]}" ` {
		time_format "2006-01-02 15:04:05"
		duration_format "string"
		time_local
		level_format "upper"
	}
}

# 2. 磁盘文件输出 (标准 JSON，供 CrowdSec / 统一日志平台读取分析)
log {
	output file /srv/logs/access.log {
		roll_size 50mb
		roll_keep 3
		roll_keep_for 72h
	}
	format json {
		time_format "iso8601"
	}
}
