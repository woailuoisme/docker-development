# ==============================================================================
# Coraza WAF (OWASP Core Rule Set v4) 业务误报精准排除配置文件
#
# 最佳实践说明：
# 1. 本文件遵循 Cloudflare / AWS WAF 规则排除 (Rule Exclusions / Scope-Down) 规范。
# 2. 当 Coraza 运行在 DetectionOnly 或 On 模式下，若业务合法请求（如富文本提交、
#    Swagger 文档、含代码片段的 JSON）被误报拦截，请在此处按路由精准排除特定规则。
# 3. 严禁使用无路径限定的全局关规则（ctl:ruleRemoveById），必须使用 REQUEST_URI、
#    REQUEST_FILENAME 等精准限制匹配范围，确保仅对受影响的合法接口放行。
# ==============================================================================

# ------------------------------------------------------------------------------
# 模板 1：Swagger / OpenAPI / API 文档路径排除
# 现象：API 文档常引用 package.json、schema.json 或复杂路径，容易误触 LFI 规则
# ------------------------------------------------------------------------------
# SecRule REQUEST_URI "@beginsWith /swagger" \
#     "id:10001,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveById=930130"

# SecRule REQUEST_URI "@beginsWith /docs" \
#     "id:10002,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveById=930130"

# ------------------------------------------------------------------------------
# 模板 2：富文本 / Markdown / 内容发布接口 XSS 误报排除
# 现象：博客后台、文章发布合法包含 HTML 标签或 Javascript 代码片段，触发 XSS 规则
# ------------------------------------------------------------------------------
# SecRule REQUEST_URI "@beginsWith /api/v1/articles" \
#     "id:10010,\
#     phase:2,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveById=941100,\
#     ctl:ruleRemoveById=941160"

# ------------------------------------------------------------------------------
# 模板 3：复杂搜索 / 动态多条件过滤接口 SQL 注入误报排除
# 现象：报表统计或搜索参数中包含 order by, union, select 等业务词汇，触发 SQLi 规则
# ------------------------------------------------------------------------------
# SecRule REQUEST_URI "@beginsWith /api/v1/search" \
#     "id:10020,\
#     phase:2,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveById=942100"

# ------------------------------------------------------------------------------
# 模板 4：第三方 Webhook 回调接口放行 (如 GitHub, Stripe, 微信支付)
# 现象：外部厂商回调请求体格式复杂且签名验证在业务层完成，可针对回调 URL 旁路 CRS 检查
# ------------------------------------------------------------------------------
# SecRule REQUEST_URI "@beginsWith /api/webhooks/" \
#     "id:10030,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_BODY"
