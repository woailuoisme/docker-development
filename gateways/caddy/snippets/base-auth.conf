# ============================================================================
# base-auth.conf - 基础身份验证配置片段
# ============================================================================
# - 动态加载环境变量中的基础认证凭据，防范源码越权泄露隐患
# - 必须在宿主机或环境变量中配置 BASIC_AUTH_USER 和 BASIC_AUTH_PASSWORD_HASH
#   生成密码 Hash 示例：docker compose run --rm --no-deps caddy caddy hash-password --plaintext 'your_password'
# ============================================================================

basic_auth {
	{env.BASIC_AUTH_USER} {env.BASIC_AUTH_PASSWORD_HASH}
}
