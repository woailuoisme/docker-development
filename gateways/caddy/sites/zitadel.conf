# ============================================================================
# zitadel.conf - ZITADEL 统一身份认证平台与 Login V2 前端反代配置
# ============================================================================

zitadel.{$SITE_ADDRESS} {
	import ../snippets/request-log.conf
	import ../snippets/security.conf
	encode zstd gzip

	# 根路径访问自动重定向至 Login V2 UI 页面
	redir / /ui/v2/login/ 302

	# Login V2 用户界面 (Next.js 独立服务)
	handle /ui/v2/login* {
		reverse_proxy zitadel-login:3000
	}

	# /api 路径别名：自动去除 /api 前缀后转发给 API 服务 (h2c 协议)
	handle_path /api* {
		reverse_proxy zitadel-api:8080 {
			transport http {
				versions h2c 2
			}
		}
	}

	# 其余所有端点（OIDC、OAuth、gRPC、Connect-RPC 与管理端点）
	handle {
		reverse_proxy zitadel-api:8080 {
			transport http {
				versions h2c 2
			}
		}
	}
}
