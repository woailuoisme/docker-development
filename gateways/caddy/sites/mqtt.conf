# ============================================================================
# Caddy MQTT 站点反向代理配置 (mqtt.conf)
# ============================================================================
#
# 【架构说明】
# 1. 外部加密连接 (WSS)：
#    客户端通过 wss://mqtt.{$SITE_ADDRESS} (443端口) 连入 Caddy。
#    Caddy 自动申请 TLS 证书并进行解密 (TLS 卸载)，然后将 WebSockets 流量
#    转发到同一 Docker 网络内的 mosquitto:9001 端口。
#
# 2. 外部非加密 TCP 直连 (MQTT)：
#    传统的物联网设备可通过宿主机的 1883 端口直接连入。
#    流量由 Docker 端口转发机制直接送达 mosquitto:1883 端口，不经过 Caddy 反代。
#
# ============================================================================
# 【客户端连接说明】
#
# ----------------------------------------------------------------------------
# 【方案 A：加密长连接 (MQTT over WebSockets - WSS - 推荐)】
#   - 协议类型: WSS (Secure WebSockets)
#   - 连接地址: wss://mqtt.{$SITE_ADDRESS}/mqtt  (支持根路径 / 或任意子路径 /mqtt)
#   - 物理端口: 443 (Caddy 监听 HTTPS 端口，在其上自动管理并卸载 TLS 证书)
#   - 适配场景: H5 网页应用、微信小程序、Node.js 服务端、浏览器仪表盘、物联网关
#
#   【MQTT 5.0 / WSS 核心连接选项与细节】：
#   1. Protocol Version: 必须选择 5.0 (或版本号 5)。
#   2. WebSocket Subprotocols (子协议): 握手时客户端必须指定 WS 子协议为 `mqtt`，
#      Mosquitto 仅能识别此协议头（主流客户端库如 mqtt.js 会在协议设为 wss 时默认携带）。
#   3. Session Expiry (会话过期): MQTT 5.0 引入了独立于 Clean Start 的 Session Expiry 属性。
#      建议连接时设置 `sessionExpiryInterval: 86400` (秒，即1天)，防止断连后会话立即被清除。
#   4. User Properties (用户属性): 可在 CONNECT 报文中携带自定义 KV (如 trace-id: xxx)，用于链路追踪。
#
#   【客户端连接示例 (以 JavaScript mqtt.js 库为例)】:
#   ```javascript
#   const mqtt = require('mqtt');
#   const client = mqtt.connect('wss://mqtt.yourdomain.com/mqtt', {
#       protocolVersion: 5,           // 启用 MQTT 5.0
#       clean: false,                 // 保留会话
#       properties: {
#           sessionExpiryInterval: 86400 // 会话在断开连接后保存 24 小时
#       },
#       username: 'your_username',
#       password: 'your_password',
#       rejectUnauthorized: true      // 生产环境必须校验 Caddy 的证书
#   });
#   ```
#
#   【客户端连接示例 (以 MQTTX 客户端工具为例)】:
#   - Client ID: 填写设备唯一标识 (如 `device-01`)
#   - Host: 选择 `wss://`，域名填写 `mqtt.yourdomain.com`，端口填写 `443`
#   - Path: 填写 `/mqtt` (或保持默认)
#   - MQTT Version: 选择 `5.0`
#   - Username/Password: 填入在 startup.sh 环境变量中生成的对应密码
#
# ----------------------------------------------------------------------------
# 【方案 B：非加密 TCP 连接 (Native TCP MQTT)】
#   - 协议类型: MQTT (Native TCP)
#   - 连接地址: 宿主机 IP 或物理绑定的域名
#   - 物理端口: 1883 (直接由 Docker 端口映射暴露，跳过七层 Caddy)
#   - 适配场景: 内网高吞吐微服务互访、不具备运行 HTTPS 栈的老旧物联网单片机
#   - 5.0 配置: 同样支持配置协议版本 5.0。连接字符串格式为 `mqtt://yourhost:1883`。
#
# ============================================================================
# 【网关健康检查说明】
#   - 地址: https://mqtt.{$SITE_ADDRESS}/health
#   - 响应: HTTP 200 OK (返回 "OK")
#
# ============================================================================

mqtt.{$SITE_ADDRESS} {
	import ../snippets/request-log.conf
	import ../snippets/security.conf
	import ../snippets/waf.conf

	encode zstd gzip

	# 保留健康检查，用于网络探针检测
	handle /health {
		respond "OK" 200
	}

	# 代理所有其它流量（包括 WSS 连接请求）至 Mosquitto 的 9001 WebSockets 端口
	handle {
		reverse_proxy mosquitto:9001 {
			header_up X-Accel-Buffering "no"
			flush_interval -1
			transport http {
				dial_timeout 10s
				response_header_timeout 30s
				read_timeout 1h
				write_timeout 1h
			}
		}
	}
}
