# =============================================================================
# layer4：缓存入口 —— 单端口 6379，由 Caddy 终止 TLS
#
# 域名直接写进匹配器，只接受这一个 SNI：
#   valkey.{$SITE_ADDRESS} → valkey:6379        （{$SITE_ADDRESS} 由 .env 注入）
#
# 连接串（**不必写端口** —— Redis 协议默认端口即 6379，与 postgres 端点一致）：
#   redis-cli --tls -h valkey.<域名> -a "$REDIS_PASSWORD"
#   rediss://:<password>@valkey.<域名>/0             # URI 形式（rediss = TLS）
#
# 改本文件前必读 —— 三条硬约束：
#   1) 只接受 SNI = valkey.<域名>；不带 SNI、或 SNI 不匹配的连接一律落到最后的
#      close（**不会**给出 TLS alert，这一点与单纯依赖选证书失败不同）。
#      ★ 实测 redis-cli / hiredis **不发送 SNI**，因此本端点不可用 redis-cli，
#      也不可用 IP；可用的是「以主机名连接、会发 SNI」的客户端（redis-py /
#      ioredis / go-redis 等）。若必须支持 redis-cli，需改架构：在 valkey 侧启用
#      tls-port 并由 Caddy 透传（或直接发布 valkey 的 TLS 端口），届时客户端 TLS
#      直达 valkey，没有 SNI 要求。
#   2) 本端点**不声明 alpn**：RESP 客户端通常不发送 ALPN，而客户端未提供该扩展时
#      服务端不要求交集，因此可用。—— 这与 postgres 端点必须钉住 `alpn postgresql`
#      （否则 no_application_protocol / alert 120）的情况相反。
#   3) 为什么**不需要 subroute**（与 postgres.conf 的结构差异是刻意的）：valkey
#      客户端一上来就发 ClientHello，顶层 matcher 立刻能拿到 SNI；postgres 默认路径
#      要先由 postgres_tls 应答 8 字节 SSLRequest，ClientHello 才出现，故必须进
#      subroute 做二级匹配。只有「终止 TLS 之后还要按内容分流」时才需要 subroute。
#
# 终止而非透传的原因：valkey 侧未启用 tls-port（见 database/valkey/valkey.conf），
#   透传等于让 AUTH 口令明文过公网。
# 注意：容器之间**不应**走本入口（内网直接 valkey:6379，明文零开销）。
# 历史沿革与各条结论的实测过程见 git 历史。
# =============================================================================
:6379 {
	# 只接受 valkey.<域名> 的 TLS 连接
	@tls tls sni valkey.{$SITE_ADDRESS}
	route @tls {
		tls
		proxy valkey:6379
	}

	# 其余（RESP 明文、无 SNI、SNI 不匹配）：直接断开
	route {
		close
	}
}
