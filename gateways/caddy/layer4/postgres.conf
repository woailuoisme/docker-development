# =============================================================================
# layer4：数据库入口 —— 单端口 5432 双上游，按 SNI 分流，由 Caddy 终止 TLS
#
# 上游由**主机名**决定，因此连接串里不必写端口（Postgres 默认端口即 5432）：
#   pg.<域名>         → postgres:5432     直连
#   pgp.<域名>  → pgbouncer:15432   经池（事务池化）
#
# 连接串：
#   psql "postgresql://<user>:<pwd>@pg.<域名>/<db>?sslmode=require"
#   psql "postgresql://<user>:<pwd>@pgp.<域名>/<db>?sslmode=require"
#   psql "postgresql://<user>:<pwd>@pgp.<域名>/pgbouncer?sslmode=require" -c 'SHOW POOLS'
#
# 改本文件前必读 —— 三条硬约束（均已实测）：
#   1) 客户端必须用**域名**（发 SNI）。用 IP 选不到证书也匹配不到路由，
#      会被最后的 close 规则断开；tls handler 的 default_sni 实测不生效。
#   2) 每个 tls handler 都必须显式声明 `alpn postgresql`：libpq 即使在经典路径
#      也会携带 ALPN postgresql，而 layer4 的 tls handler 默认沿用 Caddy 的
#      h2 / http/1.1，交集为空即 no_application_protocol (alert 120)。
#   3) `tls` matcher 的 `sni` 会吞掉其后所有参数 —— 不能写成 `sni X alpn Y`
#      （会解析成 sni=[X,"alpn","Y"]）。ALPN 只由 tls handler 钉住。
#
# 为什么要覆盖两条协商路径（官方 18 文档：`sslnegotiation` 默认值仍是 postgres）：
#   1) 经典 SSLRequest（默认路径）：postgres_tls 先应答 `S`，此时 SNI 尚不可见，
#      故进 subroute 做二级匹配后按 SNI 分流。
#   2) 直连 TLS（客户端显式 sslnegotiation=direct）：ClientHello 先行，直接匹配。
#
# 池化端点（pgp.<域名>）的行为差异，详见 database/pgbouncer/README.md：
#   - 事务池化不支持会话级特性（LISTEN、会话级 advisory lock、跨语句临时表等）
#   - `pgbouncer` 是管理控制台虚拟库（不是数据目录）：只支持简单协议 ——
#     psql 可用，GUI 客户端（JDBC 系、dbx/sqlx 等原生驱动）不可用
#   - 控制台可 PAUSE / RESUME / KILL / SHUTDOWN 连接池，凭据即 postgres
#
# 明文客户端、以及 SNI 不匹配的连接一律直接断开（失败优先，不保留明文入口）。
# 历史沿革与各条结论的实测过程见 git 历史。
# =============================================================================
:5432 {
	# ---- 路径 1：经典 SSLRequest（libpq 默认协商方式）----
	@pg postgres
	route @pg {
		postgres_tls
		subroute {
			# 直连上游
			@direct tls sni pg.{$SITE_ADDRESS}
			route @direct {
				tls {
					connection_policy {
						alpn postgresql
					}
				}
				proxy postgres:5432
			}

			# 池化上游
			@pooled tls sni pgp.{$SITE_ADDRESS}
			route @pooled {
				tls {
					connection_policy {
						alpn postgresql
					}
				}
				proxy pgbouncer:15432
			}

			# 未知 SNI：断开
			route {
				close
			}
		}
	}

	# ---- 路径 2：直连 TLS（sslnegotiation=direct，需客户端显式设置）----
	@direct_tls tls sni pg.{$SITE_ADDRESS}
	route @direct_tls {
		tls {
			connection_policy {
				alpn postgresql
			}
		}
		proxy postgres:5432
	}

	@pooled_tls tls sni pgp.{$SITE_ADDRESS}
	route @pooled_tls {
		tls {
			connection_policy {
				alpn postgresql
			}
		}
		proxy pgbouncer:15432
	}

	# ---- 其余（明文）或 SNI 不匹配：断开 ----
	route {
		close
	}
}
