services:
  caddy:
    build:
      context: .
    container_name: caddy
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - AWS_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      - AWS_SECRET_ACCESS_KEY=${ALIYUN_ACCESS_KEY_SECRET:-${AWS_SECRET_ACCESS_KEY:-}}
      - CROWDSEC_BOUNCER_KEY_CADDY=${CROWDSEC_BOUNCER_KEY_CADDY:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${APP_CODE_PATH}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${CONFIG_PATH}gateways/caddy:/etc/caddy
      - ${DATA_PATH}caddy:/data/caddy
      - ${LOG_PATH}caddy:/srv/logs
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "diun.enable=true"
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - dozzle
      - authelia
    #   - php-roadrunner
    #   - php-fpm
    networks:
      - frontend
      - backend
