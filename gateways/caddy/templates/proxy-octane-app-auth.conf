(proxy-octane-app-auth) {
	{args[0]} {
		import ../snippets/request-log.conf
		import ../snippets/security.conf
		import ../snippets/waf.conf
		encode zstd gzip

		# 1. 代理 Authelia 认证服务路由 (无需认证)
		handle /authelia* {
			reverse_proxy authelia:9091
		}

		# 2. 需要认证保护的路径
		# 必须放在公共静态资源之前，防止受保护路径下的静态资源 (如 /docs/js/app.js) 绕过认证
		@protected {
			path /docs*
			path /log-viewer*
			path /horizon*
		}
		handle @protected {
			forward_auth authelia:9091 {
				uri /api/authz/forward-auth
				copy_headers Remote-User Remote-Groups Remote-Email Remote-Name
			}
			root * {args[2]}
			# 如果文件不存在，则反向代理到 Octane 后端
			@not_file {
				not file {
					try_files {path}
				}
			}
			reverse_proxy @not_file {args[1]} {
				transport http {
					# 保持 128 个长连接 (默认 32)
					keepalive_idle_conns_per_host 128
					# 空闲连接保持时间 (默认 120s)
					keepalive 60s
					# 连接超时时间 (默认 3s)
					dial_timeout 2s
				}
			}
			file_server
		}

		# 3. 公共存储目录直接响应 (无需认证)
		handle /storage/* {
			root * {args[2]}
			file_server
			header Cache-Control "public, max-age=604800" # 7天
		}

		# 4. 公共静态资源直接响应 (无需认证)
		@static {
			path_regexp \.(js|css|png|jpg|jpeg|ico|woff2|woff|ttf|svg|webp|gif|map)$
		}
		handle @static {
			root * {args[2]}
			file_server {
				precompressed gzip br # 自动查找 .gz / .br 预压缩文件
			}
			header Cache-Control "public, max-age=31536000, immutable"
		}

		# 5. 默认兜底处理 (反向代理到 Octane 后端)
		handle {
			reverse_proxy {args[1]} {
				transport http {
					# 保持 128 个长连接 (默认 32)，足以应对大多数高并发场景
					keepalive_idle_conns_per_host 128
					# 1 分钟左右比较稳健 (默认 120s)
					keepalive 60s
					# 快速失败：2s 连不上就报错 (默认 3s)
					dial_timeout 2s
				}
			}
		}
	}
}
