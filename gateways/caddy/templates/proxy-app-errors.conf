# ==============================================================================
# Caddy 统一美化错误页反代模板 (Proxy App with Error Pages)
# 依赖: gateways/error-pages 容器 (error-pages:8080)
# 用法: import proxy-app-errors <domain> <upstream>
# 示例: import proxy-app-errors myapp.{$SITE_ADDRESS} myapp-container:8080
# ==============================================================================
(proxy-app-errors) {
	{args[0]} {
		import ../snippets/request-log.conf
		import ../snippets/security.conf
		import ../snippets/waf/waf.conf

		encode zstd gzip

		# 处理 Caddy 网关自身引发的错误 (如上游不可达时的 502/503/504)
		handle_errors {
			rewrite * /{err.status_code}
			reverse_proxy error-pages:8080
		}

		# 反向代理至业务上游服务，并拦截 4xx/5xx 错误响应
		reverse_proxy {args[1]} {
			@upstream_error status 4xx 5xx
			handle_response @upstream_error {
				rewrite * /{http.reverse_proxy.status_code}
				reverse_proxy error-pages:8080
			}

			header_up X-Accel-Buffering "no"
			flush_interval -1
			transport http {
				dial_timeout 10s
				response_header_timeout 30s
				read_timeout 1h
				write_timeout 1h
			}
		}
	}
}
