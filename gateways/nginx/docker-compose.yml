services:
  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - PHP_UPSTREAM=${PHP_UPSTREAM:-php-fpm:9000}
      - API_UPSTREAM=${API_UPSTREAM:-api:8080}
      - FRONTEND_UPSTREAM=${FRONTEND_UPSTREAM:-frontend:3000}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${APP_CODE_PATH}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      - ${DATA_PATH}ssl:/etc/nginx/ssl
    ports:
      - "${NGINX_HOST_HTTP_PORT:-80}:80"
      - "${NGINX_HOST_HTTPS_PORT:-443}:443"
      - "${NGINX_HOST_WSS_PORT:-8080}:8080"
    networks:
      - frontend
      - backend
