# TCP/UDP 流代理配置 (适用场景：PostgreSQL、Redis 等非 HTTP 协议转发)
# 使用方式：在 nginx.conf 的 stream {} 块中 include /etc/nginx/snippets/stream.conf;

# 日志格式定义
log_format stream_log '$remote_addr [$time_local] '
                      '$protocol $status $bytes_sent $bytes_received '
                      '$session_time';

# --- PostgreSQL ---
server {
    listen 45432;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_postgres "postgres:5432";
    proxy_pass $upstream_postgres;
    proxy_connect_timeout 10s;
    proxy_timeout 30m;
    access_log /dev/stdout stream_log;
    error_log /dev/stderr;
}

# --- Redis ---
server {
    listen 46379;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_redis "redis:6379";
    proxy_pass $upstream_redis;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
    access_log /dev/stdout stream_log;
    error_log /dev/stderr;
}
