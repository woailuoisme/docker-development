# ==============================================================================
# Nginx 核心配置 (Standard Nginx Core Configuration)
# ==============================================================================
user nginx;
worker_processes auto;
worker_cpu_affinity auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 20480;
    multi_accept on;
    use epoll;
    accept_mutex off;
}

# TCP/UDP 流代理 (PostgreSQL、Redis 等非 HTTP 协议转发，按需启用)
# stream {
#     include /etc/nginx/snippets/stream.conf;
# }

http {
    # 1. WebSocket 协议升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 2. 核心网络与缓冲配置 (超时、字符集、缓冲区、Docker DNS)
    include /etc/nginx/snippets/http-core.conf;

    # 3. 日志配置 (结构化输出至 stdout/stderr)
    include /etc/nginx/snippets/logging.conf;

    # 4. Gzip 高性能压缩
    include /etc/nginx/snippets/compression.conf;

    # 5. 防刷与限流策略 (Anti-DDoS / Rate Limit)
    include /etc/nginx/snippets/anti-ddos.conf;

    # 6. 虚拟主机站点加载 (由 templates 渲染后的 conf.d 目录)
    include /etc/nginx/conf.d/*.conf;
}
