services:
  error-pages:
    container_name: error-pages
    image: tarampampam/error-pages:4.2
    restart: unless-stopped
    environment:
      TEMPLATE_NAME: l7
      SHOW_DETAILS: "true"
      DEFAULT_ERROR_PAGE: "404"
      LOG_FORMAT: json
      LOG_LEVEL: info
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "/bin/httpcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: frontend
      # --- 内部服务端口声明 ---
      traefik.http.services.error-pages.loadbalancer.server.port: "8080"
      # --- 错误页预览路由 (errors.{$SITE_ADDRESS}) ---
      traefik.http.routers.error-pages-preview.rule: Host(`errors.${SITE_ADDRESS}`)
      traefik.http.routers.error-pages-preview.entrypoints: websecure
      traefik.http.routers.error-pages-preview.service: error-pages
      traefik.http.routers.error-pages-preview.tls: "true"
      # --- 兜底捕获路由 (Catch-All Router: 未匹配域名统一返回美化 404) ---
      traefik.http.routers.error-pages-catchall.rule: HostRegexp(`.+`)
      traefik.http.routers.error-pages-catchall.entrypoints: websecure
      traefik.http.routers.error-pages-catchall.priority: "1"
      traefik.http.routers.error-pages-catchall.service: error-pages
      traefik.http.routers.error-pages-catchall.middlewares: error-pages-middleware
      traefik.http.routers.error-pages-catchall.tls: "true"
      # --- Traefik 错误拦截中间件定义 (提供给 Docker 提供者路由使用) ---
      traefik.http.middlewares.error-pages-middleware.errors.status: "400-599"
      traefik.http.middlewares.error-pages-middleware.errors.service: error-pages
      traefik.http.middlewares.error-pages-middleware.errors.query: /{status}
