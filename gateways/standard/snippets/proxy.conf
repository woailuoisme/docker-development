# 通用反向代理配置 (Universal Proxy Configuration)
# 适用场景：所有反向代理业务 (API, Web, WebSocket, SSE)
# 默认超时：60s (标准短连接)
#
# 使用方式：
#   location / {
#       include /etc/nginx/snippets/proxy.conf;
#       proxy_pass http://backend;
#
#       # [可选] 针对 WebSocket/长连接/大文件上传，请手动覆盖超时：
#       # proxy_read_timeout 3600s;
#       # proxy_send_timeout 3600s;
#   }

# ---------------------------------------------------------
# 1. 核心 Headers (Core Headers)
# ---------------------------------------------------------
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ---------------------------------------------------------
# 2. WebSocket 支持 (WebSocket Support)
# ---------------------------------------------------------
# 默认支持 Upgrade 协议头，允许 HTTP 升级为 WebSocket
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# ---------------------------------------------------------
# 3. 缓存控制 (Cache Bypass)
# ---------------------------------------------------------
# 当客户端请求 Upgrade 时绕过缓存
proxy_cache_bypass $http_upgrade;

# ---------------------------------------------------------
# 4. 默认超时设置 (Default Timeouts)
# ---------------------------------------------------------
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
