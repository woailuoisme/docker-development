services:
  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: jlesage/nginx-proxy-manager:latest
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
    ports:
      - "8181:8181"
      - "8080:8080"
      - "4443:4443"
    volumes:
      - ${DATA_PATH}nginx-proxy-manager:/config:rw
    networks:
      - frontend
      - backend
