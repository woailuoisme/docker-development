services:
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: livekit
    restart: always
    security_opt:
      - no-new-privileges:true
    command: --config /etc/livekit.yaml
    environment:
      - REDIS_HOST=${LIVEKIT_REDIS_ADDR:-valkey:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ${CONFIG_PATH}media/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # 7880: HTTP / WebSocket 信令端口 (Signal, API)
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      # 7881: TCP 回退传输端口 (RTC over TCP)
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      # 7882: 内置 TURN / STUN 服务器 UDP 端口
      - "${LIVEKIT_TURN_PORT:-7882}:7882/udp"
      # 50000-50100/udp: WebRTC RTC 媒体数据流传输端口范围 (UDP)
      - "${LIVEKIT_RTC_PORT_RANGE:-50000-50100:50000-50100/udp}"
    networks:
      - frontend
      - backend
