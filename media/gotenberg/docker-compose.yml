services:
  gotenberg:
    image: gotenberg/gotenberg:8.36-chromium
    container_name: gotenberg
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # 3000: Gotenberg HTTP 文档与网页转 PDF/图片 API 端口
      - "${GOTENBERG_PORT:-3080}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend
      - backend
