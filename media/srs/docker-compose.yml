services:
  srs:
    image: ossrs/srs:6
    container_name: srs
    restart: always
    security_opt:
      - no-new-privileges:true
    command: ./objs/srs -c conf/srs.conf
    environment:
      - CANDIDATE=${SRS_CANDIDATE:-127.0.0.1}
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - ${DATA_PATH}srs/objs/nginx/html:/usr/local/srs/objs/nginx/html
    ports:
      # 1935: RTMP 推流与拉流服务
      - "${SRS_RTMP_PORT:-1935}:1935"
      # 1985: HTTP API 控制与 WebRTC 信令服务
      - "${SRS_API_PORT:-1985}:1985"
      # 8080: HTTP 媒体服务 (分发 HTTP-FLV / HLS 切片与内置 Web 控制台)
      - "${SRS_HTTP_PORT:-8080}:8080"
      # 8000: WebRTC 媒体数据传输协议 (UDP)
      - "${SRS_RTC_PORT:-8000}:8000/udp"
      # 10080: SRT 极速低延迟传输协议 (UDP)
      - "${SRS_SRT_PORT:-10080}:10080/udp"
    networks:
      - frontend
      - backend
