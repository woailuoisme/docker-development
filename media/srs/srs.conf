# ==============================================================================
# SRS (Simple Realtime Server) 6.x 核心配置文件 - srs.conf
# 官方中文文档: https://ossrs.net/lts/zh-cn/docs/v6/doc/introduction
# ==============================================================================

# 1. 基础服务监听与运行模式
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

# 2. HTTP API 控制接口 (用于监控状态、WebRTC 信令交互与集群管理)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# 3. HTTP 流媒体与静态服务器 (分发 HTTP-FLV、HLS 切片及 SRS 内置 Web 控制台/播放器)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# 4. WebRTC 媒体传输服务 (UDP)
rtc_server {
    enabled         on;
    listen          8000;
    # 客户端连接的服务器 IP 地址 (局域网/公网 IP，默认可通过环境变量 $CANDIDATE 动态替换)
    # @see https://ossrs.net/lts/zh-cn/docs/v6/doc/webrtc#config-candidate
    candidate       $CANDIDATE;
}

# 5. SRT 极速低延迟传输协议服务 (UDP)
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
    connect_timeout 4000;
    peerlatency     0;
    recvlatency     0;
    latency         0;
    tsbpdmode       off;
    tlpktdrop       off;
    sendbuf         2000000;
    recvbuf         2000000;
}

# 6. 默认虚拟主机业务分发规则
vhost __defaultVhost__ {
    # HLS (HTTP Live Streaming) 切片流分发
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
    }

    # HTTP-FLV 低延迟流分发
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # WebRTC 互转引擎 (RTMP <-> WebRTC 双向实时转换)
    rtc {
        enabled     on;
        # RTMP 推流自动转换为 WebRTC 超低延迟播放
        rtmp_to_rtc on;
        # WebRTC 推流自动转换为 RTMP / HLS / FLV 播放
        rtc_to_rtmp on;
    }

    # SRT 互转引擎 (SRT 推流转换为 RTMP / WebRTC)
    srt {
        enabled     on;
        srt_to_rtmp on;
    }
}
