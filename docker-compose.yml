networks:
  frontend:
    name: frontend
    external: ${NETWORK_EXTERNAL:-false}
  backend:
    name: backend
    external: ${NETWORK_EXTERNAL:-false}

volumes:
  app_code:
    name: app_code
    driver: local
    driver_opts:
      type: bind
      source: ${APP_CODE_PATH}
      o: bind,rw

# ==============================================================================
# Docker Compose V2 模块化服务编排 (按需取消注释启用)
# ==============================================================================
include:
  # ============================================================================
  # 1. 网络网关与安全反代 (Gateway & Security)
  # ============================================================================
  - gateways/docker-compose.yml             # 统一网络网关、反向代理、DNS与证书工具链 (Caddy / Dnsmasq / Cloudflared / Traefik / 3X-UI / S-UI / Nginx / Certs)

  # ============================================================================
  # 2. 数据库与持久存储 (Databases & Storage)
  # ============================================================================
  # --- 数据库、键值缓存与数据管理平台 ---
  - database/docker-compose.yml             # 统一数据库技术栈 (PostgreSQL / MySQL / Redis / Valkey / Meilisearch / Qdrant / ClickHouse / MongoDB / SurrealDB / Adminer / Bytebase)

  # --- 对象存储与持久备份 ---
  - storage/docker-compose.yml              # 对象存储、文件同步与快照备份网关 (Garage / MinIO / FileBrowser / Rclone / Restic)
  # - etcd/docker-compose.yml               # etcd 分布式键值与服务发现


  # ============================================================================
  # 3. 消息队列与事件广播 (Messaging & Realtime)
  # ============================================================================
  - messaging/docker-compose.yml            # 统一消息队列、实时推送与队列看板 (Centrifugo / NATS / RabbitMQ / Notifications / Monitors)

  # ============================================================================
  # 4. 实时流媒体与多媒体服务 (Media Streaming & Processing)
  # ============================================================================
  - media/docker-compose.yml                # 音视频与多媒体处理技术栈 (MediaMTX / LiveKit / SRS 6 / imgproxy)

  # ============================================================================
  # 5. 物联网与智能硬件编排 (IoT & Edge Computing)
  # ============================================================================
  - iot/docker-compose.yml                  # 物联网与智能硬件套件 (Mosquitto / Telegraf / Node-RED / Simulators / WiFi-DensePose)

  # ============================================================================
  # 6. PHP / Laravel 运行环境 (PHP Runtimes)
  # ============================================================================
  # - php/docker-compose.yml                # PHP/Laravel 全栈运行环境 (FPM / RoadRunner / FrankenPHP / Horizon / Schedule / Reverb)

  # ============================================================================
  # 7. 开发协作与 CI/CD 工具 (DevTools & CI/CD)
  # ============================================================================
  - devtools/docker-compose.yml             # 开发者协作、代码仓库与 CI/CD 平台 (Mailpit / Gitea / Woodpecker / Dokploy)

  # ============================================================================
  # 8. 可观测性与运维监控 (Observability & Monitoring)
  # ============================================================================
  - docker-tools/docker-compose.yml         # Docker 宿主守护与容器运维工具 (Socket Proxy / Dozzle / Beszel / Portainer / Arcane / PruneMate / WUD / Diun / Watchtower)
  - observability/docker-compose.yml      # 统一可观测性技术栈 (Grafana / Vector / VictoriaMetrics / Loki / Tempo)


  # ============================================================================
  # 9. 身份平台与访问管理 (Identity & Access Management / IAM)
  # ============================================================================
  - iam/docker-compose.yml                  # 统一身份认证与凭证管理平台 (Authelia / Vaultwarden / Casdoor / ZITADEL / Infisical)

  # ============================================================================
  # 10. 业务应用与自建服务 (Self-Hosted Apps & Productivity)
  # ============================================================================
  # - cms/docker-compose.yml                # 开源无头 CMS 与快速应用开发后端 (Directus / PocketBase / WordPress)
  # - apps/docker-compose.yml               # 协作办公、知识库与个人自建效率服务 (Homepage / Docs / Draw.io / DrawDB / Excalidraw / Gotenberg / LibreSpeed / Tuwunel / Sshwifty / Chatwoot / GoAccess / Uptime Kuma / RustDesk)
