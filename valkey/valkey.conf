# Valkey 9.0.1 配置文件 - 高性能生产优化版
# 专注于高并发、低延迟以及大容量处理，针对 Laravel 场景进行了深度调优

################################## 网络配置 #####################################
bind 0.0.0.0
port 6379
protected-mode yes
# 高并发连接优化：调整 TCP backlog 队列长度
tcp-backlog 4096
# TCP 保活探测间隔，防止死连接占用资源
tcp-keepalive 300

# Valkey 9.0 新特性：Multipath TCP (MPTCP)
# 如果宿主机内核支持，启用 MPTCP 可显著降低多路径网络下的延迟
mptcp no

################################# 身份验证 #####################################
# 生产环境建议通过环境变量 VALKEY_PASSWORD 动态设置
# requirepass ${VALKEY_PASSWORD}

################################# 高性能核心 ###################################
# 多线程 IO: 极大提升网络吞吐量 (建议设置为 CPU 核心数 - 1)
io-threads 4
# 启用读线程，进一步提升并发处理能力
io-threads-do-reads yes

# Valkey 9.0 新特性：命令预取优化 (替代了旧版的 lookahead)
# 增加命令预取深度，提升单核和多线程下的流水线吞吐量 (最高提升 40%)
prefetch-batch-max-size 32

# Lazy Free (延迟释放): 将耗时的释放操作移至后台，减少主线程阻塞
# 内存满时异步淘汰
lazyfree-lazy-eviction yes
# 过期键异步删除
lazyfree-lazy-expire yes
# 隐式删除操作异步化
lazyfree-lazy-server-del yes
# 用户显式 DEL 命令异步化
lazyfree-lazy-user-del yes
# FLUSHDB/FLUSHALL 异步化
lazyfree-lazy-user-flush yes

################################## 内存管理 #####################################
# 最大内存限制
maxmemory 512mb
# 淘汰策略：noeviction 针对 BullMQ/Laravel Queue 场景，避免任务数据因内存限制被意外删除
maxmemory-policy noeviction
# 增加采样数，提高淘汰算法精度
maxmemory-samples 10

# 主动碎片整理: 在运行时动态回收内存碎片，保持长期高性能
activedefrag yes
# 碎片达到此值才开始整理
active-defrag-ignore-bytes 100mb
# 碎片率达到 10% 开始整理
active-defrag-threshold-lower 10

# 容器化优化
# 调整 OOM 分数，提高容器在内存紧张时的稳定性
oom-score-adj yes
# 启用 jemalloc 后台线程，优化内存分配效率
jemalloc-bg-thread yes

################################ 快照持久化 ################################
# 性能导向的保存策略，减少 RDB fork 频率
save 900 1
save 300 100
save 60 10000

################################ AOF 持久化 ###############################
# 启用 AOF，提供更好的数据安全性
appendonly yes
# AOF 文件名
appendfilename "appendonly.aof"
# 每秒同步一次，平衡性能与安全
appendfsync everysec

# 重写期间暂停 fsync: 避免 AOF 重写时的磁盘 IO 阻塞主线程
no-appendfsync-on-rewrite yes

# 混合持久化: 结合 RDB 的加载速度和 AOF 的数据安全性
aof-use-rdb-preamble yes
# AOF 文件增长一倍时触发重写
auto-aof-rewrite-percentage 100
# 触发重写的最小文件大小
auto-aof-rewrite-min-size 64mb

################################ Laravel 场景优化 ################################
# 针对 Laravel Cache, Queue (List), Session (Hash) 场景的数据结构优化
# 优化 Hash 存储，适合 Laravel Session/Cache
hash-max-listpack-entries 512
hash-max-listpack-value 256
# 优化 List 存储 (8KB)，适合 Laravel Queue 消息
list-max-listpack-size -2
# 优化 Set 存储
set-max-intset-entries 512
# 优化 ZSet 存储，适合排行榜/延迟队列
zset-max-listpack-entries 128
zset-max-listpack-value 256
# 优化 Stream 存储，提升流处理性能
stream-node-max-bytes 8192
stream-node-max-entries 200

# 提高过期键清理力度 (1-10，默认 1)，适合 Laravel Horizon 等大量 TTL 任务场景
active-expire-effort 3

################################## 限制与日志 ##################################
# 最大并发客户端连接数
maxclients 20000
# 生产环境推荐 notice
loglevel notice
# Valkey 9.0 集群模式现在支持多数据库
databases 8

################################## 性能监控 ####################################
# 记录超过 10ms 的慢查询
slowlog-log-slower-than 10000
# 慢查询日志最大长度
slowlog-max-len 128
# 启用延迟监控，阈值 100ms
latency-monitor-threshold 100

# Valkey 9.0 增强监控
# 启用延迟跟踪
latency-tracking yes
# 导出百分位监控数据
latency-tracking-info-percentiles "50.0 99.0 99.9"
