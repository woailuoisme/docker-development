# Valkey 8.1 配置文件 - 高性能生产优化版
# 专注于高并发、低延迟以及大容量处理，移除冗余配置

################################## 网络配置 #####################################
bind 0.0.0.0                      # 监听所有网络接口，容器化必需
port 6379                         # 默认端口
protected-mode yes                # 开启保护模式，仅允许本地或授权连接
# 高并发连接优化：调整 TCP backlog 队列长度以匹配内核限制 (4096 也是极高性能水平)
tcp-backlog 4096
tcp-keepalive 300                 # TCP 保活探测间隔，防止死连接占用资源

################################# 身份验证 #####################################
# 生产环境建议通过环境变量 VALKEY_PASSWORD 动态设置，此处保持注释
# requirepass ${VALKEY_PASSWORD}

################################# 高性能核心 ###################################
# 多线程 IO: 极大提升网络吞吐量 (建议设置为 CPU 核心数 - 1)
io-threads 4
io-threads-do-reads yes           # 启用读线程，进一步提升并发处理能力

# Lazy Free (延迟释放): 将耗时的释放操作移至后台，减少主线程阻塞
lazyfree-lazy-eviction yes        # 内存满时异步淘汰
lazyfree-lazy-expire yes          # 过期键异步删除
lazyfree-lazy-server-del yes      # 隐式删除操作异步化
lazyfree-lazy-user-del yes        # 用户显式 DEL 命令异步化
lazyfree-lazy-user-flush yes      # FLUSHDB/FLUSHALL 异步化

################################## 内存管理 #####################################
maxmemory 512mb                   # 最大内存限制
maxmemory-policy allkeys-lru      # 淘汰策略：所有 key 中的 LRU，提高缓存命中率
maxmemory-samples 10              # 增加采样数，提高淘汰算法精度

# 主动碎片整理: 在运行时动态回收内存碎片，保持长期高性能
activedefrag yes
active-defrag-ignore-bytes 100mb  # 碎片达到此值才开始整理
active-defrag-threshold-lower 10  # 碎片率达到 10% 开始整理

################################ 快照持久化 ################################
# 性能导向的保存策略，减少 RDB fork 频率
save 900 1                        # 15 分钟至少 1 次变更
save 300 100                      # 5 分钟至少 100 次变更
save 60 10000                     # 1 分钟至少 10000 次变更

################################ AOF 持久化 ###############################
appendonly yes                    # 启用 AOF，提供更好的数据安全性
appendfilename "appendonly.aof"   # AOF 文件名
appendfsync everysec              # 每秒同步一次，平衡性能与安全

# 重写期间暂停 fsync: 避免 AOF 重写时的磁盘 IO 阻塞主线程 (对延迟敏感的应用至关重要)
no-appendfsync-on-rewrite yes

# 混合持久化: 结合 RDB 的加载速度和 AOF 的数据安全性
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100   # AOF 文件增长一倍时触发重写
auto-aof-rewrite-min-size 64mb    # 触发重写的最小文件大小

################################## 限制与日志 ##################################
maxclients 20000                  # 最大并发客户端连接数
loglevel notice                   # 生产环境推荐 notice
databases 8                       # 适度的数据库数量 (默认 16，此处减为 8)

################################## 性能监控 ####################################
slowlog-log-slower-than 10000     # 记录超过 10ms 的慢查询
slowlog-max-len 128               # 慢查询日志最大长度
latency-monitor-threshold 100     # 启用延迟监控，阈值 100ms
