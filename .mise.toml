[tools]
# --- 构建 & 任务管理 ---
just = "latest"          # 任务运行器，全项目命令入口与质量门禁驱动
lefthook = "latest"      # Git 提交前钩子管理工具

# --- 代码质量与 Lint ---
shellcheck = "latest"    # Shell 脚本静态分析 (just lint-sh)
shfmt = "latest"         # Shell 脚本格式化 (lefthook)
hadolint = "latest"      # Dockerfile 规范检查 (just lint-docker)
actionlint = "latest"    # GitHub Actions 工作流检查 (just lint-actions)
rumdl = "latest"         # Markdown 格式化与规范检查 (just lint-md / just fmt)

# --- 工具链依赖 ---
fd = "latest"            # 文件过滤查找 (justfile 批量 lint 依赖)
jq = "latest"            # JSON 处理工具 (OpenBao / 机密脚本依赖)

# --- 安全审计 ---
trivy = "latest"         # 镜像漏洞与 IaC 配置安全扫描 (just scan-*)
