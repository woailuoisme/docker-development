services:
  pocketbase:
    build: .
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ${DATA_PATH}pocketbase/pb_data:/pb/pb_data
      - ./pb_public:/pb/pb_public
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-admin@admin.com}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-1234567890}
    networks:
      - backend
