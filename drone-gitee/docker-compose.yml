networks:
  backend:
    name: backend
    external: ${NETWORK_EXTERNAL:-false}

services:
  drone-gitee-server:
    image: drone/drone:${DRONE_VERSION:-2.24.0}
    container_name: drone-gitee-server
    restart: always
    ports:
      - "${DRONE_GITEE_SERVER_PORT:-10081}:80"
    environment:
      - DRONE_SERVER_HOST=${DRONE_GITEE_SERVER_HOST:-localhost:10081}
      - DRONE_SERVER_PROTO=${DRONE_GITEE_SERVER_PROTO:-http}
      - DRONE_RPC_SECRET=${DRONE_GITEE_RPC_SECRET:-drone_gitee_rpc_secret}
      - DRONE_GITEE_SERVER=${DRONE_GITEE_SERVER:-https://gitee.com}
      - DRONE_GITEE_CLIENT_ID=${DRONE_GITEE_CLIENT_ID:-}
      - DRONE_GITEE_CLIENT_SECRET=${DRONE_GITEE_CLIENT_SECRET:-}
      - DRONE_DATABASE_DRIVER=sqlite3
      - DRONE_DATABASE_DATASOURCE=/data/drone.sqlite
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${DATA_PATH}drone-gitee:/data
    networks:
      - backend

  drone-gitee-runner:
    image: drone/drone-runner-docker:${DRONE_RUNNER_VERSION:-1.8.3}
    container_name: drone-gitee-runner
    restart: always
    depends_on:
      - drone-gitee-server
    environment:
      - DRONE_RPC_PROTO=${DRONE_GITEE_SERVER_PROTO:-http}
      - DRONE_RPC_HOST=drone-gitee-server:80
      - DRONE_RPC_SECRET=${DRONE_GITEE_RPC_SECRET:-drone_gitee_rpc_secret}
      - DRONE_RUNNER_CAPACITY=${DRONE_RUNNER_CAPACITY:-2}
      - DRONE_RUNNER_NAME=${DRONE_RUNNER_NAME:-drone-gitee-runner}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
