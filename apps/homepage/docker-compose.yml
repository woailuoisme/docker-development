services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.1
    container_name: homepage
    restart: always
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - HOMEPAGE_ALLOWED_HOSTS=home.${SITE_ADDRESS},localhost,127.0.0.1,homepage
      - HOMEPAGE_VAR_SITE_ADDRESS=${SITE_ADDRESS}
      - HOMEPAGE_VAR_DOMAIN=${SITE_ADDRESS}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "33000:3000"
    volumes:
      - ${CONFIG_PATH}apps/homepage/config:/app/config

    depends_on:
      - docker-socket-proxy
    networks:
      - frontend
      - backend

