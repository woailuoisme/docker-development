# RustDesk 自建服务端（OSS 免费版）
#
# 服务说明：
#   hbbs  ID/注册服务器（Rendezvous Server）
#         负责客户端注册、NAT 类型检测、连接协商
#   hbbr  中继服务器（Relay Server）
#         当 P2P 直连失败时负责流量中继
#
# 客户端配置（RustDesk → 设置 → 网络）：
#   ID 服务器:    ${SITE_ADDRESS}        （或宿主机 IP）
#   中继服务器:   ${SITE_ADDRESS}:21117  （留空则自动使用 ID 服务器）
#   API 服务器:   （留空）
#   Key:          见 ./data/rustdesk/id_ed25519.pub 内容（服务首次启动后生成）

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:1
    command: hbbs -r ${SITE_ADDRESS}:21117
    volumes:
      - ${DATA_PATH}rustdesk:/root
    ports:
      - "21115:21115"        # NAT 类型检测
      - "21116:21116"        # 注册/心跳（TCP）
      - "21116:21116/udp"    # 注册/心跳（UDP）
      - "21118:21118"        # WebSocket（Web 客户端）
    healthcheck:
      test: ["CMD", "/usr/bin/hbbs", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - hbbr
    restart: unless-stopped
    networks:
      - proxy

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:1
    command: hbbr
    volumes:
      - ${DATA_PATH}rustdesk:/root
    ports:
      - "21117:21117"        # 中继（TCP）
      - "21119:21119"        # WebSocket（Web 客户端中继）
    healthcheck:
      test: ["CMD", "/usr/bin/hbbr", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
