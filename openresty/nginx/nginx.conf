# 生产级别 OpenResty 核心配置
user www-data;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式优化 (JSON 格式方便 ELK/Loki 采集)
    log_format main_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_response_time":"$upstream_response_time",'
        '"ups_addr":"$upstream_addr",'
        '"ups_status":"$upstream_status"'
    '}';

    access_log /usr/local/openresty/nginx/logs/access.log main_json;

    # 基础优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # 隐藏版本号

    # Gzip 压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP/3 (QUIC) 优化
    quic_gso on; # 开启 GSO (Generic Segmentation Offload)
    ssl_early_data on; # 开启 TLS 1.3 0-RTT

    # OpenResty 生产级扩展配置
    # 1. 共享内存字典: 用于存储黑名单 IP、速率限制计数器等
    lua_shared_dict ip_blacklist 10m;
    lua_shared_dict limit_req_store 100m;
    lua_shared_dict config_cache 1m;

    # auto-ssl 共享内存
    lua_shared_dict auto_ssl 1m;
    lua_shared_dict auto_ssl_settings 64k;

    # 2. Lua 模块路径
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # auto-ssl 初始化
    init_by_lua_block {
        auto_ssl = require("resty.auto-ssl").new()

        -- 定义哪些域名允许自动申请证书
        auto_ssl:set("allow_domain", function(domain)
            -- 生产环境建议通过 Redis 或数据库检查域名合法性
            -- 这里简单示范：只允许特定后缀
            return ngx.re.match(domain, [[\.(haoxiaoguai\.xyz)$]], "ijo")
        end)

        auto_ssl:init()
    }

    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }
    
    # 常用安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # auto-ssl 内部回调服务器 (用于处理 Let's Encrypt 挑战)
    server {
        listen 127.0.0.1:8999;
        location / {
            content_by_lua_block {
                auto_ssl:hook_server()
            }
        }
    }

    # 包含子配置
    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
}
