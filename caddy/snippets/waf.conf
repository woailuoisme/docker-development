# ============================================
# WAF (Web Application Firewall) 规则
# Caddy Web 应用防火墙配置 (Optimized)
# ============================================
#
# 功能说明：
#   拦截常见的 Web 攻击，包括：
#   - 恶意扫描工具和爬虫
#   - 敏感文件访问 (高性能 path 匹配)
#   - 路径遍历攻击
#   - 恶意请求方法
#   - 精简版 SQL 注入及 XSS 防护
#   - 文件包含攻击
#   - Log4Shell 等漏洞防护 (含 Header 扫描)
#
# 注意：此版本采用 abort 响应拦截，直接断开 TCP 连接以迷惑扫描器。
#
# ============================================


# --------------------------------------------
# 1. 恶意扫描工具和爬虫检测
# --------------------------------------------
@bad_bot {
	header_regexp User-Agent (?i)(sqlmap|nmap|nikto|acunetix|dirbuster|masscan|nuclei|gobuster|burpsuite|wfuzz|ffuf|zgrab|censys|shodan)
}

handle @bad_bot {
	abort
}

# --------------------------------------------
# 2. 敏感文件访问防护 (已优化为原生 path 匹配)
# --------------------------------------------
@sensitive_files {
	path *.env *.env.* *.git* *.svn* *.sql *.bak *.log *.config *.htaccess *.htpasswd composer.json composer.lock package.json package-lock.json yarn.lock pnpm-lock.yaml Dockerfile .dockerignore artisan server.php wp-config.php *.sql.gz *.old *.backup *.tmp *.idea* *.vscode* *.pem *.key *.crt *.nginx.conf web.config
}

handle @sensitive_files {
	abort
}

# --------------------------------------------
# 3. 路径遍历攻击防护
# --------------------------------------------
@path_traversal {
	path_regexp (?i)(\.\.\/|\.\.\\|etc\/passwd|etc\/shadow|\/bin\/sh|\/bin\/bash|cmd\.exe|powershell)
}

handle @path_traversal {
	abort
}

# --------------------------------------------
# 4. 管理后台路径防护 (已优化为原生前缀匹配)
# --------------------------------------------
@admin_paths {
	path /phpmyadmin* /adminer* /wp-admin* /wp-login* /administrator* /manager* /console* /phpinfo*
}

handle @admin_paths {
	abort
}

# --------------------------------------------
# 5. 恶意请求方法防护
# --------------------------------------------
@bad_methods {
	method TRACE TRACK DEBUG CONNECT
}

handle @bad_methods {
	abort
}

# --------------------------------------------
# 6. SQL 注入攻击防护 (精简防误杀版)
# --------------------------------------------
# 要求出现引号或其他注入前缀，结合 SQL 关键字，降低拦截正常博客文章的风险。
@sql_injection_path {
	path_regexp `(?i)(%27|'|%22|").*(union.*select|insert.*into|delete.*from|drop.*table|truncate.*table)`
}

handle @sql_injection_path {
	abort
}

# --------------------------------------------
# 7. XSS 跨站脚本攻击防护
# --------------------------------------------
@xss_path {
	path_regexp (?i)(<script|javascript:|on\w+\s*=)
}

handle @xss_path {
	abort
}

# --------------------------------------------
# 8. 文件包含攻击防护 (LFI/RFI)
# --------------------------------------------
@file_inclusion_path {
	path_regexp (?i)(file:|php:|data:|expect:|zip:|phar:|glob:|dict:|gopher:|ldap:)
}

handle @file_inclusion_path {
	abort
}

# --------------------------------------------
# 9. Log4Shell / JNDI 注入防护 (覆盖 Path 与常见 Header)
# --------------------------------------------
@log4shell_path {
	path_regexp (?i)(\$\{jndi:|\$\{java:|\$\{env:|\$\{sys:|\$\{lower:|\$\{upper:|%24%7Bjndi|%24%7Bjava|%24%7Benv|%24%7Bsys)
}

@log4shell_ua {
	header_regexp User-Agent (?i)(\$\{jndi:|\$\{java:|\$\{env:|\$\{sys:|\$\{lower:|\$\{upper:|%24%7Bjndi)
}
@log4shell_ref {
	header_regexp Referer (?i)(\$\{jndi:|\$\{java:|\$\{env:|\$\{sys:|\$\{lower:|\$\{upper:|%24%7Bjndi)
}
@log4shell_xff {
	header_regexp X-Forwarded-For (?i)(\$\{jndi:|\$\{java:|\$\{env:|\$\{sys:|\$\{lower:|\$\{upper:|%24%7Bjndi)
}

handle @log4shell_path {
	abort
}
handle @log4shell_ua {
	abort
}
handle @log4shell_ref {
	abort
}
handle @log4shell_xff {
	abort
}
