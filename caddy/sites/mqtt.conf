# ============================================================================
# Caddy MQTT 站点反向代理配置 (mqtt.conf)
# ============================================================================
#
# 【架构说明】
# 1. 外部加密连接 (WSS)：
#    客户端通过 wss://mqtt.{$SITE_ADDRESS} (443端口) 连入 Caddy。
#    Caddy 自动申请 TLS 证书并进行解密 (TLS 卸载)，然后将 WebSockets 流量
#    转发到同一 Docker 网络内的 mosquitto:9001 端口。
#
# 2. 外部非加密 TCP 直连 (MQTT)：
#    传统的物联网设备可通过宿主机的 1883 端口直接连入。
#    流量由 Docker 端口转发机制直接送达 mosquitto:1883 端口，不经过 Caddy 反代。
#
# ============================================================================
# 【客户端连接说明】
#
# 【方案 A：加密长连接 (MQTT over WebSockets - 推荐)】
#   - 协议类型: WSS (Secure WebSockets)
#   - 连接地址: wss://mqtt.{$SITE_ADDRESS}
#   - 物理端口: 443 (默认 HTTPS 端口)
#   - 适配场景: 前端网页应用、管理后台、支持 WSS 的现代物联网硬件
#
# 【方案 B：非加密 TCP 连接 (Native TCP MQTT)】
#   - 协议类型: MQTT (Native TCP)
#   - 连接地址: 宿主机 IP 或绑定的域名
#   - 物理端口: 1883
#   - 适配场景: 内网微服务互访、老旧或资源受限的 TCP 物联网设备
#
# ============================================================================
# 【网关健康检查说明】
#   - 地址: https://mqtt.{$SITE_ADDRESS}/health
#   - 响应: HTTP 200 OK (返回 "OK")
#
# ============================================================================

mqtt.{$SITE_ADDRESS} {
	import ../snippets/request-log.conf
	import ../snippets/security.conf
	import ../snippets/waf.conf

	encode zstd gzip

	# 保留健康检查，用于网络探针检测
	handle /health {
		respond "OK" 200
	}

	# 代理所有其它流量（包括 WSS 连接请求）至 Mosquitto 的 9001 WebSockets 端口
	handle {
		reverse_proxy mosquitto:9001 {
			header_up X-Accel-Buffering "no"
			flush_interval -1
			transport http {
				dial_timeout 10s
				response_header_timeout 30s
				read_timeout 1h
				write_timeout 1h
			}
		}
	}
}
