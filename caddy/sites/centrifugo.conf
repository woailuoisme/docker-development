# ============================================================================
# centrifugo.conf - Centrifugo 客户端推送服务的反代配置
# ============================================================================
# - 仅对外放行客户端连接和订阅请求，屏蔽内部管理后台与监控指标
# ============================================================================

push.{$SITE_ADDRESS} {
	import ../snippets/request-log.conf
	import ../snippets/security.conf
	import ../snippets/waf.conf
	encode zstd gzip

	# 仅代理客户端长连接和协议通道
	@client_endpoints {
		path /connection/*
	}
	handle @client_endpoints {
		reverse_proxy centrifugo:8000 {
			header_up X-Accel-Buffering "no"
			flush_interval -1
		}
	}

	# 拦截并阻断其他所有未授权管理路径（如 /admin、/metrics）
	handle {
		abort
	}
}
