services:
  postgres:
    container_name: postgres
    build:
      context: .
    restart: always
    # 扩大共享内存，保障 pgvector 并发检索与并行查询性能
    shm_size: 256mb
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ${DATA_PATH}postgres18:/var/lib/postgresql
      - ${CONFIG_PATH}postgres-18/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${CONFIG_PATH}postgres-18/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - backend
