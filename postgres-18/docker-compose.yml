services:
  postgres:
    container_name: postgres
    build:
      context: .
    restart: always
    # 共享内存：需 ≥ shared_buffers (256MB)，预留余量给并行查询/超表的动态共享内存段 (DSM)
    shm_size: 512mb
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # 需要安装 TimescaleDB 的库（空格分隔）；扩展会在每个装载库常驻 scheduler 后台进程，按需声明避免空装
      - TIMESCALE_DATABASES=${TIMESCALE_DATABASES:-lunchbox}
    volumes:
      - ${DATA_PATH}postgres18:/var/lib/postgresql
      - ${CONFIG_PATH}postgres-18/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${CONFIG_PATH}postgres-18/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - backend
