# ==============================================================================
# Eclipse Mosquitto 2.x 生产级精简配置
# 官方参考: https://mosquitto.org/man/mosquitto-conf-5.html
# ==============================================================================

# ------------------------------------------------------------------------------
# 监听器配置 (Listeners)
# ------------------------------------------------------------------------------
# 1. TCP MQTT 协议监听器
listener 1883 0.0.0.0
protocol mqtt
set_tcp_nodelay true

# 2. WebSockets 协议监听器 (供 Web 前端、H5、IoT 仪表盘直连或经反向代理访问)
listener 9001 0.0.0.0
protocol websockets

# ------------------------------------------------------------------------------
# 认证与授权 (Security & ACL)
# ------------------------------------------------------------------------------
# 严禁匿名访问
allow_anonymous false

# 凭据与权限控制策略文件（只读挂载）
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ------------------------------------------------------------------------------
# 持久化与会话 (Persistence & Session)
# ------------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
# 内存状态刷盘保存间隔（秒）
autosave_interval 300
autosave_on_changes false

# 离线持久客户端会话过期时间 (1天)，防止离线客户端队列无限堆积导致内存耗尽
persistent_client_expiration 1d

# ------------------------------------------------------------------------------
# 资源限制与性能保护 (Resource Limits & DoS Protection)
# ------------------------------------------------------------------------------
# 单条消息最大包体积 (10MB，防止恶意大包导致 OOM)
max_packet_size 10485760

# QoS 1/2 待派发离线消息队列上限
max_queued_messages 2000

# 飞行中未确认消息并发数 (提高吞吐量)
max_inflight_messages 40

# 允许的最大并发连接 (-1 为无限制，依赖容器与操作系统 ulimit nofile)
max_connections -1

# ------------------------------------------------------------------------------
# 日志系统 (Logging)
# ------------------------------------------------------------------------------
# 容器标准输出，交由 Docker 日志驱动或日志采集器收集
log_dest stdout

# 生产环境记录级别：错误与警告
log_type error
log_type warning
log_type notice

connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# 系统内部监控状态 ($SYS) 更新间隔 (秒)
sys_interval 60

# ------------------------------------------------------------------------------
# 协议与客户端特性 (Protocol Features)
# ------------------------------------------------------------------------------
retain_available true
allow_zero_length_clientid true
listener_auto_id_prefix auto-
