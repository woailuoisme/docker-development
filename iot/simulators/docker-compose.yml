services:
  simulator-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simulator
    restart: always
    stdin_open: true
    tty: true
    env_file:
      - ./.env
    environment:
      - MQTT_HOST=mosquitto # 容器内部互联使用服务名，覆盖 .env 中的 localhost
      - TZ=Asia/Shanghai
    depends_on:
      - mosquitto
    networks:
      - backend
      - frontend
