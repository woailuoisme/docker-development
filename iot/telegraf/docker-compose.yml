services:
  telegraf:
    build:
      context: .
    container_name: telegraf
    restart: always
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8181
      - INFLUXDB_DATABASE=iot
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
    ports:
      - "9080:8080" # 监控与指标端点
    tty: true
    stdin_open: true
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - backend
