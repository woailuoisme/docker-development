# =============================================================================
# LiveKit Server 配置文件 - livekit.yaml (v1.13.x 最佳实践规范)
# 官方配置文档: https://docs.livekit.io/home/self-hosting/deployment/
# 完整配置参考: https://github.com/livekit/livekit/blob/master/config-sample.yaml
# =============================================================================

# 1. 基础服务与信令端口 (HTTP / WebSocket Signal & API)
port: 7880
bind_addresses:
  - ""

# 2. WebRTC RTC 传输配置
rtc:
  # TCP 回退端口 (当客户端 UDP 受限被防火墙阻断时自动降级走 ICE over TCP)
  tcp_port: 7881
  # WebRTC 媒体流 UDP 端口范围 (与 docker-compose 映射保持一致)
  port_range_start: 50000
  port_range_end: 50100
  # 本地开发环境建议设为 false；云服务器公网部署时设为 true (自动通过 STUN 探测外网 IP)
  use_external_ip: false
  # 云服务器公网固定 IP 部署时可显式指定 (当 use_external_ip: false 时生效):
  # node_ip: "1.2.3.4"
  # 是否开启拥塞控制 (自适应码率调度，默认开启)
  congestion_control:
    enabled: true
    allow_pause: true

# 3. 内置 TURN / STUN 服务器配置 (用于复杂对称 NAT 穿透)
turn:
  enabled: true
  domain: ""
  tls_port: 0
  udp_port: 7882

# 4. Redis / Valkey 分布式集群协调与房间状态同步 (可通过环境变量 REDIS_HOST 动态覆盖)
redis:
  address: valkey:6379
  username: ""
  password: ""
  db: 0

# 5. 鉴权密钥对 (API Key : Secret)
# 业务服务端 (Node.js/Go/PHP) 使用此密钥签发客户端加入房间的 JWT Token
keys:
  devkey: secretsecretsecretsecretsecretsecret

# 6. 房间与生命周期管理 (可选最佳实践调优)
room:
  # 房间内所有人都离开后，房间自动销毁的超时时间 (秒)
  empty_timeout: 300
  # 单个用户断网后等待重新连接的超时时间 (秒)
  departure_timeout: 20
  # 单房间最大容纳人数 (0 为不限制)
  max_participants: 200

# 7. Webhook 事件回调 (可选: 当房间创建、用户加入/离开、轨道发布时主动通知业务后端)
# webhook:
#   api_key: devkey
#   urls:
#     - "http://workspace:8000/api/livekit/webhook"

# 8. 日志输出配置
logging:
  json: false
  level: info

