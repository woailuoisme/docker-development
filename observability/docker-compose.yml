# ==============================================================================
# Observability & Monitoring 可观测性与监控告警技术栈模块化编排
# 可根据实际开发需求，保留或注释对应的监控、日志与追踪组件
# ==============================================================================
include:
  - grafana/docker-compose.yml       # Grafana 统一可视化多源数据看板
  - vector/docker-compose.yml        # Vector 高性能全能可观测性数据管道 (核心日志/指标采集与中继)
  - victoria-metrics/docker-compose.yml # VictoriaMetrics 核心 TSDB 时序数据库与原生抓取引擎
  - victoria-logs/docker-compose.yml    # VictoriaLogs 极速轻量日志存储引擎
  - tempo/docker-compose.yml         # Grafana Tempo 分布式链路追踪存储
