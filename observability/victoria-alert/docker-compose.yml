services:
  vmalert:
    image: victoriametrics/vmalert:v1.151.0
    container_name: vmalert
    restart: always
    ports:
      - "${VMALERT_PORT:-8880}:8880"
    command:
      - "-rule=/etc/alerts/*.yml"
      - "-datasource.url=http://victoria-metrics:8428"
      - "-remoteWrite.url=http://victoria-metrics:8428"
      - "-remoteRead.url=http://victoria-metrics:8428"
      - "-evaluationInterval=15s"
      - "-httpListenAddr=:8880"
      # 只评估 + 在 Web UI 展示，不对外发送告警：
      # 本栈的告警投递由 Grafana Alerting 负责（observability/grafana/provisioning/alerting/）。
      # 注意：不设 notifier 时 vmalert 会 fatal 退出
      #   「config contains alerting rules but neither -notifier.url nor -notifier.config
      #     nor -notifier.blackhole aren't set」
      # 这正是它此前无法启用的原因（规则文件含 alerting 规则，而 compose 未配 notifier）。
      - "-notifier.blackhole"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./alerts.yml:/etc/alerts/alerts.yml:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    networks:
      - backend
    depends_on:
      - victoria-metrics
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
