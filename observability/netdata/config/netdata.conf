# ==============================================================================
# Netdata Configuration for Low-Resource Environments (低配置服务器精简调优)
# ==============================================================================

[global]
    # 采集采样频率 (秒)：由默认 1 秒放宽至 2 秒，降低 50% 采集 CPU 唤醒与系统调用
    update every = 2

    # 禁用高频访问日志，保留必要错误日志到 stderr
    access log = none
    error log = /dev/stderr
    debug log = none

[db]
    # 存储引擎模式：单层存储 (Tier 0)，关闭多层降采样历史 (Tier 1/2)，大幅减少内存占用
    mode = dbengine
    storage tiers = 1

    # 限制 Page Cache 缓存内存为 16MB (默认 32MB~64MB)，确保低配 VPS 不爆内存
    dbengine page cache size MB = 16

    # 限制磁盘指标存储空间为 256MB，防止打满低配置服务器磁盘空间
    dbengine multihost disk space MB = 256

[ml]
    # 彻底关闭机器学习异常检测引擎 (Anomaly Detection)，避免持续训练与推理的 CPU/内存开销
    enabled = no

[cloud]
    # 禁用 Netdata Cloud 联机功能，保持纯单机内网离线运行，杜绝云端心跳与遥测开销
    enabled = no

[plugins]
    # 禁用高开销内核级追踪与调试插件 (低配机器无需开启 eBPF / slabinfo)
    ebpf = no
    slabinfo = no

[web]
    # Web 控制台监听配置
    bind to = 0.0.0.0:19999
    mode = static-threaded
