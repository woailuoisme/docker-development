services:
  # 【必要】OTLP 统一摄取网关：应用遥测 → OpenObserve（重试/排队/批处理，后端重启不丢数据）
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC（宿主应用上报入口）
      - "4318:4318" # OTLP HTTP
    environment:
      # "Basic " + base64("账号:密码")，与 OpenObserve 摄取凭证一致，只放 .env
      O2_AUTH: ${O2_AUTH:?请在 .env 设置 O2_AUTH（"Basic " + base64(账号:密码)）}
    volumes:
      - ./config.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      - openobserve
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  backend:
    external: true
    name: backend
