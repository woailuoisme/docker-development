services:
  glitchtip:
    container_name: glitchtip
    image: glitchtip/glitchtip:6.2
    restart: always
    depends_on:
      - postgres
      - valkey
    environment:
      - SECRET_KEY=d125ca3078b4b4c59d8bc1313ce60bcb19ddeb0271137b8b31a7398c2dea09a8
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      - VALKEY_URL=redis://:${REDIS_PASSWORD}@valkey:6379/1
      - GLITCHTIP_DOMAIN=http://localhost:18080
      - GLITCHTIP_EMBED_WORKER=true
      - ENABLE_ORGANIZATION_CREATION=true
      - LOG_LEVEL=INFO
      - TZ=${TIMEZONE:-Asia/Shanghai}
    ports:
      - "18080:8000"
    volumes:
      - ${DATA_PATH:-./data/}glitchtip:/code/uploads
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M


