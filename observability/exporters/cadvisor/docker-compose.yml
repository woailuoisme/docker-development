services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      # 注意：cadvisor v0.60.5 已移除 accelerator 指标，写上会导致启动即退出（invalid value ... unsupported metric）
      - "--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
    networks:
      - backend
    expose:
      - 8080
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 96M
