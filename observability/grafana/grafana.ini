# ==============================================================================
# Grafana 核心主配置文件 (grafana.ini)
# 注：在此声明的基础配置可被 docker-compose.yml 中的环境变量 (GF_*) 动态覆盖
# ==============================================================================

# ==============================================================================
# SECTION 1: 路径与持久化目录设定
# ==============================================================================
[paths]
data = /var/lib/grafana                     # 数据与 SQLite 元数据库存储路径
logs = /var/log/grafana                     # 日志文件存储路径
plugins = /var/lib/grafana/plugins          # 动态安装与持久化插件目录
provisioning = /etc/grafana/provisioning    # 自动化配置（数据源、仪表盘、告警）挂载目录

# ==============================================================================
# SECTION 2: Web 服务器与网络访问
# ==============================================================================
[server]
http_port = 3000                            # 容器内 HTTP 监听端口（宿主机通过 13000 端口映射）
root_url = %(protocol)s://%(domain)s:%(http_port)s/ # 动态协议与域名模板，用于生成对外分享链接与重定向

# ==============================================================================
# SECTION 3: 后端元数据库 (Database)
# ==============================================================================
[database]
# 默认配置为内置 SQLite 引擎；
# 在开发/生产容器编排中，已被 docker-compose.yml 环境变量覆盖为 PostgreSQL 统一存储：
#   - GF_DATABASE_TYPE=postgres
#   - GF_DATABASE_HOST=postgres:5432
#   - GF_DATABASE_NAME=lunchbox
#   - GF_DATABASE_MAX_OPEN_CONN=10 (连接池上限保护)

# ==============================================================================
# SECTION 4: 遥测与更新检查 (Analytics - 安全与隐私)
# ==============================================================================
[analytics]
check_for_updates = false                   # 关闭新版本联网检查（避免无意义的公网出站探测）
reporting_enabled = false                   # 关闭向官方发送匿名使用统计报告

# ==============================================================================
# SECTION 5: 安全与访问策略
# ==============================================================================
[security]
admin_user = admin                          # 默认初始管理员账号（会被 GF_SECURITY_ADMIN_USER 覆盖）
admin_password = admin                      # 默认初始管理员密码（会被 GF_SECURITY_ADMIN_PASSWORD 覆盖）
allow_embedding = true                      # 允许通过 <iframe> 嵌入第三方系统/管理后台
hide_version = true                         # 隐藏登录页与 HTTP Header 中的 Grafana 版本号，加固安全

# ==============================================================================
# SECTION 6: 用户注册与默认界面体验
# ==============================================================================
[users]
allow_sign_up = false                       # 禁止外部访客自主注册账号
auto_assign_org = true                      # 新建用户自动加入默认组织
auto_assign_org_role = Editor               # 新用户加入默认组织后的初始权限角色 (Viewer/Editor/Admin)
default_language = zh-Hans                  # 默认系统界面语言设为简体中文
help_enabled = false                        # 隐藏控制台顶部的帮助文档入口
news_feed_enabled = false                   # 禁用官方新闻订阅推送流
feedback_enabled = false                    # 禁用用户反馈与调研弹出窗口

# ==============================================================================
# SECTION 7: 匿名免密访问 (Anonymous Access - 用于大屏与内网监控)
# ==============================================================================
[auth.anonymous]
enabled = true                              # 启用匿名免密访问模式
org_role = Viewer                           # 匿名访客仅赋予只读查看权限 (Viewer)，保障配置安全

# ==============================================================================
# SECTION 8: 日志输出格式与控制台输出
# ==============================================================================
[log]
mode = console                              # 日志输出模式：标准控制台输出 (适应 Docker 日志驱动采集)
level = info                                # 日志等级：info / warn / error / debug

[log.console]
format = console                            # 控制台日志格式 (console / json)
use_colors = true                           # 终端日志启用高亮色彩区分

# ==============================================================================
# SECTION 9: 告警引擎控制 (Alerting)
# ==============================================================================
[alerting]
enabled = false                             # 禁用旧版 (Legacy) 告警引擎

[unified_alerting]
enabled = false                             # 禁用内置统一告警调度（当前仅使用指标与大屏展示，节约运行开销）

# ==============================================================================
# SECTION 10: 默认首页仪表盘设置
# ==============================================================================
[dashboards]
# 访客登录或匿名访问时默认直接展示的核心看板
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/iot_vending_dashboard.json