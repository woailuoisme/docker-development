# ==============================================================================
# Grafana 数据源预配：Grafana Tempo 分布式追踪系统
# 规范：Grafana Datasource Provisioning (apiVersion: 1)
# 作用：连接 Tempo 链路追踪服务，支持分布式调用链检索并与日志进行联动
# ==============================================================================
apiVersion: 1

datasources:
  - name: Tempo                             # 数据源显示名称
    type: tempo                             # 数据源类型：Grafana 官方 Tempo 原生插件
    uid: tempo                              # 数据源唯一 UID
    access: proxy                           # 访问模式：proxy 后端代理
    url: http://tempo:3200                  # Tempo 容器内部 HTTP 查询 API 监听地址
    isDefault: false                        # 不作为默认全局数据源
    jsonData:
      httpMethod: GET                       # 查询请求方式 (GET)
      # ------------------------------------------------------------------------
      # Traces to Logs 联动功能 (从链路跳转查看关联日志)
      # ------------------------------------------------------------------------
      tracesToLogsV2:
        datasourceUid: loki                 # 日志数据源 UID（如配置 Loki/VictoriaLogs）
        spanStartTimeShift: "-1h"           # 关联日志时间窗起始偏移（Trace 开始前 1 小时）
        spanEndTimeShift: "1h"              # 关联日志时间窗结束偏移（Trace 结束后 1 小时）
        tags: ["service.name"]              # 自动提取作为日志过滤标签的 Trace Tag 列表
        filterByTraceID: true               # 启用按 Trace ID 自动过滤日志
        filterBySpanID: false               # 不强制按 Span ID 过滤，扩大日志上下文召回面
        customQuery: true                   # 启用自定义日志检索语句构建
        query: '{$${__tags}} |= "$${__trace.id}"' # 动态模板语法：匹配对应服务与当前 Trace ID 的日志行
