# ==============================================================================
# Grafana 数据源预配：VictoriaMetrics 时序数据库
# 规范：Grafana Datasource Provisioning (apiVersion: 1)
# 作用：连接 VictoriaMetrics 监控指标存储，作为默认全局指标查询数据源
# ==============================================================================
apiVersion: 1

datasources:
  - name: VictoriaMetrics                   # 数据源显示名称
    type: prometheus                        # 数据源类型：完全兼容 Prometheus API 驱动（支持 MetricsQL）
    uid: victoriametrics                    # 数据源唯一 UID
    access: proxy                           # 访问模式：proxy 后端代理
    url: http://victoria-metrics:8428       # VictoriaMetrics 服务内部 HTTP 端口
    isDefault: true                         # 设为默认数据源 (新建面板或执行 Explore 默认选中使用)
    jsonData:
      httpMethod: POST                      # 使用 POST 提交 PromQL/MetricsQL 查询，防止长 URL 截断
      timeInterval: 15s                     # 最小采集采样步长 (Step)，与抓取频率 15s 对齐
    editable: true                          # 允许在前端界面查看或微调数据源属性
