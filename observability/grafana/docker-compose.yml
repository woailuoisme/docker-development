services:
  grafana:
    build:
      context: .
    container_name: grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ${DATA_PATH}grafana:/var/lib/grafana
      - ${CONFIG_PATH}observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${CONFIG_PATH}observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-Admin123!}
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=${TIMESCALEDB_HOST:-postgres}:5432
      - GF_DATABASE_USER=${POSTGRES_USER:-postgres}
      - GF_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - GF_DATABASE_NAME=${POSTGRES_DB:-lunchbox}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:13000}
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-localhost}
      - GF_LOG_CONSOLE_FORMAT=console
      - GF_LOG_CONSOLE_USE_COLORS=true
      - GF_DATABASE_MAX_OPEN_CONN=10
      - GF_DATABASE_MAX_IDLE_CONN=5
      - GF_DATABASE_CONN_MAX_LIFETIME=14400
      - GOMEMLIMIT=384MiB
      - GOTIFY_APP_TOKEN=${GOTIFY_APP_TOKEN}
    tty: true
    stdin_open: true
    depends_on:
      - postgres
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
