services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    container_name: victoria-metrics
    restart: always
    ports:
      - "${VICTORIA_METRICS_PORT:-8428}:8428"
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=3M"
      - "--httpListenAddr=:8428"
      # 抓取职责已移交 vmagent（observability/victoria-agent/）：这里不再配 -promscrape.config，
      # 否则同一目标会被两个 scraper 各抓一份 —— 实测每个 job 出现 2 条 up 序列，up==0 告警双发
      - "--memory.allowedPercent=60"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_PATH}victoria:/storage
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
