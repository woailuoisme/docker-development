services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    container_name: victoria-metrics
    restart: always
    ports:
      - "${VICTORIA_METRICS_PORT:-8428}:8428"
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=3M"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--memory.allowedPercent=60"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_PATH}victoria:/storage
      - ${CONFIG_PATH}observability/victoria/victoria-metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
