services:
  # 链路库 + Jaeger UI：官方 jaegertracing/jaeger 镜像（v2，OTel Collector 发行版）。
  # Jaeger v2 自带存储（badger）且 UI 只查自己的库，因此这是一个自包含的链路数据面：
  # 摄取走 OTLP，查询由 16686 原生提供 /api（Grafana 的 Jaeger 数据源可直连，无需路径改写）。
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.21.0}
    container_name: jaeger
    restart: always
    # badger 以镜像默认用户 (uid 10001) 无法写入属主为 root 的 bind mount ——
    # 官方文档专门有该故障项；本机开发栈沿用 iam/zitadel 的 user: "0" 做法。
    user: "0"
    command: ["--config", "/jaeger/config.yaml"]
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}observability/jaeger/config.yaml:/jaeger/config.yaml:ro
      - ${DATA_PATH}jaeger:/storage
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"            # UI + Jaeger Query API
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"       # OTLP/HTTP，供宿主机侧应用上报
      # OTLP/gRPC 4317 不发布到宿主机：victoria-traces 已占用该端口；容器间用 jaeger:4317
    networks:
      # frontend：供 Caddy 反代；backend：供 Grafana / vmagent 访问
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
