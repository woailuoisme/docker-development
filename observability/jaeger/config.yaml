# ==============================================================================
# Jaeger v2 单机配置 (all-in-one：OTLP 摄取 + badger 持久化 + 查询 UI)
# ==============================================================================
# 依据官方示例裁剪自：
#   https://github.com/jaegertracing/jaeger/blob/v2.21.0/cmd/jaeger/config-badger.yaml
# 仅保留本栈实际用到的部分：OTLP 接收 → 批处理 → badger 单后端 → 查询 UI / 健康检查。
# 未启用：jaeger / zipkin 旧协议接收、remote_sampling 自适应采样、AI/MCP、pprof。
# 注意：Jaeger v2 是 OTel Collector 发行版，UI 只能查自己配置的存储，无法指向
#       VictoriaTraces 的查询接口（那是 HTTP API，不是 Storage API）。
# ==============================================================================
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: basic        # 只暴露基础自监控指标，detailed 会带来高基数开销
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888    # 供 vmagent 抓取 jaeger:8888/metrics
    logs:
      level: info

extensions:
  # 健康检查：v2 端点 /status 挂在 13133，供 compose healthcheck 与 vmalert 的 up 判定
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: traces_store   # 必须与下方 jaeger_storage.backends 的键名一致

  jaeger_storage:
    backends:
      traces_store:
        badger:
          # keys / values 两个目录，官方示例即如此；挂载点统一在 /storage 下
          directories:
            keys: "/storage/badger/keys"
            values: "/storage/badger/values"
          ephemeral: false        # false = 落盘持久化；true 为内存模式，重启即丢
          ttl:
            spans: 168h           # 7 天，与 victoria-traces 的 retentionPeriod=7d 对齐
          metrics_update_interval: 1m

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: traces_store
