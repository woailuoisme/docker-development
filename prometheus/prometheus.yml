# Prometheus 全局配置
global:
  scrape_interval: 15s     # 默认抓取间隔
  evaluation_interval: 15s # 规则评估间隔
  scrape_timeout: 10s      # 抓取超时时间

  # 外部标签，用于多集群环境区分
  external_labels:
    monitor: 'acme-monitor'
    environment: 'production'

# 告警规则文件
rule_files:
  - "/etc/prometheus/rules/*.yml"

# 抓取配置
scrape_configs:
  # 监控 Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 监控宿主机 (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 监控 Valkey (使用 redis-exporter)
  - job_name: 'valkey'
    static_configs:
      - targets: ['valkey-exporter:9121']

  # 监控 Caddy2 (内置支持 /metrics)
  - job_name: 'caddy'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['caddy:2019']

  # 监控 PostgreSQL (使用 postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 监控 Docker 容器 (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
