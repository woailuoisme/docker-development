networks:
  backend:
    external: true

services:
  # Gitea 主服务
  server:
    image: gitea/gitea:${GITEA_VERSION:-1.27.0}
    container_name: gitea
    env_file: .env
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=${DB_TYPE:-sqlite3}
      - GITEA__database__PATH=/data/gitea/gitea.db
    restart: always
    networks:
      - backend
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${SSH_PORT:-222}:22"

  # Gitea Actions Runner 服务
  runner:
    image: gitea/act_runner:${GITEA_RUNNER_VERSION:-0.6.1}
    container_name: act_runner
    restart: always
    env_file: .env
    depends_on:
      - server
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "${INSTANCE_URL:-http://server:3000}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-}"
      GITEA_RUNNER_NAME: "${RUNNER_NAME:-local-runner}"
      GITEA_RUNNER_LABELS: "${RUNNER_LABELS:-ubuntu-latest:docker://node:20-bookworm,ubuntu-22.04:docker://node:20-bookworm}"
    volumes:
      - ./config.yaml:/config.yaml
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
