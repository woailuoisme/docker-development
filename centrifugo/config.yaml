# Centrifugo v6 统一基础配置
# 参考: https://centrifugal.dev/docs/server/configuration

# ============================================
# 传输协议配置
# ============================================
websocket:
  use_write_buffer_pool: true

uni_websocket:
  enabled: true

http_stream:
  enabled: true

sse:
  enabled: true

uni_sse:
  enabled: true

# ============================================
# 引擎配置 - 使用 Valkey (兼容 Redis 协议)
# ============================================
engine:
  type: redis
  redis:
    # 具体的连接地址通过环境变量 CENTRIFUGO_ENGINE_REDIS_ADDRESS 动态注入
    # v6 默认使用 Rueidis 客户端进行连接复用，无须配置 pool_size
    connect_timeout: "1s"
    io_timeout: "4s"

# ============================================
# 客户端连接配置
# ============================================
client:
  # 默认禁止匿名连接，安全至上；开发环境通过环境变量覆盖为 true
  allow_anonymous_connect_without_token: false
  
  # 跨域列表默认空，由环境变量覆盖
  allowed_origins: []

  ping_interval: 30s
  pong_timeout: 8s
  connection_limit: 10000
  user_connection_limit: 10
  queue_max_size: 1048576  # 1MB
  stale_close_delay: "10s"

# ============================================
# 管理后台与监控
# ============================================
admin:
  enabled: true
  handler_prefix: "/admin"

health:
  enabled: true

prometheus:
  enabled: true

# ============================================
# 日志配置
# ============================================
log:
  level: info  # 日志级别由环境变量 CENTRIFUGO_LOG_LEVEL 覆盖

# ============================================
# 通道命名空间配置
# ============================================
channel:
  history_meta_ttl: "720h"  # 30天
  
  namespaces:
    # public 公开命名空间：主要用于大厅、群聊或广播等场景。
    # 允许客户端直接发布和订阅。开启 history_size 与 recovery 用于防止移动端弱网重连导致消息丢失。
    - name: public
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: true
      allow_subscribe_for_client: true
      allow_subscribe_for_anonymous: false
      allow_publish_for_anonymous: false
    
    # private 私有命名空间：用于点对点通信、系统通知或敏感业务。
    # 强制校验订阅 Token，不允许客户端直接订阅（须由后端发放 Token）。
    # 禁用客户端直接 publish，确保所有上行数据必须流经后端接口校验以保障系统完整性。
    - name: private
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    # user 用户个人频道命名空间：用于推送个人特定的推送及提醒。
    # 禁用 presence 与 join_leave（个人频道无须了解其他用户的上下线状态），以极大降低高并发下的内存与网络开销。
    - name: user
      presence: false
      join_leave: false
      history_size: 50
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    # notification 实时通知命名空间：用于吞吐量高、非核心、时效性强的通知推送。
    # 减少 history 占用并关闭强制恢复（force_recovery），以减轻 Valkey/Redis 内存缓存的持久化与网络同步压力。
    - name: notification
      presence: false
      join_leave: false
      history_size: 10
      history_ttl: "60s"
      force_recovery: false
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: true
