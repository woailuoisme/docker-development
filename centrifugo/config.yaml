# Centrifugo v6 生产级配置
# 参考: https://centrifugal.dev/docs/server/configuration

# ============================================
# 传输协议配置
# ============================================
websocket:
  use_write_buffer_pool: true

uni_websocket:
  enabled: true

http_stream:
  enabled: true

sse:
  enabled: true

# ============================================
# 引擎配置 - 使用 Valkey (兼容 Redis 协议)
# ============================================
engine:
  type: redis
  redis:
    # 具体的连接地址通过环境变量 CENTRIFUGO_ENGINE_REDIS_ADDRESS 动态注入
    pool_size: 256
    min_idle_conns: 10
    dial_timeout: "5s"
    read_timeout: "3s"
    write_timeout: "3s"

# ============================================
# 客户端连接配置
# ============================================
client:
  # 生产环境默认禁止匿名连接，强制启用 JWT 校验
  allow_anonymous_connect_without_token: false
  
  # 跨域域名列表（允许从环境变量 CENTRIFUGO_CLIENT_ALLOWED_ORIGINS 传入 JSON 数组进行覆盖）
  allowed_origins: []

  ping_interval: 30s
  pong_timeout: 8s
  connection_limit: 10000
  user_connection_limit: 10
  queue_max_size: 1048576  # 1MB
  stale_close_delay: "10s"

# ============================================
# 管理后台与监控
# ============================================
admin:
  enabled: true
  # 密码和密钥将通过环境变量注入

health:
  enabled: true

prometheus:
  enabled: true

# ============================================
# 日志配置
# ============================================
log:
  level: info
  format: json # 生产环境输出 JSON

# ============================================
# 通道命名空间配置
# ============================================
channel:
  history_meta_ttl: "720h"  # 30天
  
  namespaces:
    - name: public
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: true
      allow_subscribe_for_client: true
      allow_subscribe_for_anonymous: false
      allow_publish_for_anonymous: false
    
    - name: private
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    - name: user
      presence: false
      join_leave: false
      history_size: 50
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    - name: notification
      presence: false
      join_leave: false
      history_size: 10
      history_ttl: "60s"
      force_recovery: false
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: true
