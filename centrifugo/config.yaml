# Centrifugo v6 统一基础配置
# 参考: https://centrifugal.dev/docs/server/configuration

# ============================================
# 传输协议配置
# ============================================
websocket:
  use_write_buffer_pool: true

uni_websocket:
  enabled: true

http_stream:
  enabled: true

sse:
  enabled: true

# ============================================
# 引擎配置 - 使用 Valkey (兼容 Redis 协议)
# ============================================
engine:
  type: redis
  redis:
    # 具体的连接地址通过环境变量 CENTRIFUGO_ENGINE_REDIS_ADDRESS 动态注入
    # v6 默认使用 Rueidis 客户端进行连接复用，无须配置 pool_size
    connect_timeout: "1s"
    io_timeout: "4s"

# ============================================
# 客户端连接配置
# ============================================
client:
  # 默认禁止匿名连接，安全至上；开发环境通过环境变量覆盖为 true
  allow_anonymous_connect_without_token: false
  
  # 跨域列表默认空，由环境变量覆盖
  allowed_origins: []

  ping_interval: 30s
  pong_timeout: 8s
  connection_limit: 10000
  user_connection_limit: 10
  queue_max_size: 1048576  # 1MB
  stale_close_delay: "10s"

# ============================================
# 管理后台与监控
# ============================================
admin:
  enabled: true

health:
  enabled: true

prometheus:
  enabled: true

# ============================================
# 日志配置
# ============================================
log:
  level: info  # 日志级别由环境变量 CENTRIFUGO_LOG_LEVEL 覆盖

# ============================================
# 通道命名空间配置
# ============================================
channel:
  history_meta_ttl: "720h"  # 30天
  
  namespaces:
    - name: public
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: true
      allow_subscribe_for_client: true
      allow_subscribe_for_anonymous: false
      allow_publish_for_anonymous: false
    
    - name: private
      presence: true
      join_leave: true
      history_size: 100
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    - name: user
      presence: false
      join_leave: false
      history_size: 50
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
    
    - name: notification
      presence: false
      join_leave: false
      history_size: 10
      history_ttl: "60s"
      force_recovery: false
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: true
