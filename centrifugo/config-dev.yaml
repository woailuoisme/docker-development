# Centrifugo v6 开发环境配置
# 用于本地开发和测试

# ============================================
# 传输协议配置
# ============================================
websocket:
  use_write_buffer_pool: true

uni_websocket:
  enabled: true

http_stream:
  enabled: true

sse:
  enabled: true

# ============================================
# 引擎配置 - 开发环境使用内存引擎
# ============================================
engine:
  type: memory

# ============================================
# 客户端连接配置
# ============================================
client:
  # 开发环境：允许所有来源
  allowed_origins:
    - "*"
  
  # 允许匿名连接（不需要 JWT token）
  allow_anonymous_connect_without_token: true

  ping_interval: 30s
  pong_timeout: 8s
  connection_limit: 1000
  user_connection_limit: 100

# ============================================
# 管理后台与监控
# ============================================
admin:
  enabled: true

health:
  enabled: true

prometheus:
  enabled: true

# ============================================
# 日志配置
# ============================================
log:
  level: "debug"  # 开发环境使用 debug 级别
  format: "text"   # 开发环境使用文本格式，便于查看

# ============================================
# 通道命名空间配置
# ============================================
channel:
  namespaces:
    - name: public
      presence: true
      join_leave: true
      history_size: 10
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: true
      allow_subscribe_for_client: true
    
    - name: private
      presence: true
      join_leave: true
      history_size: 10
      history_ttl: "300s"
      force_recovery: true
      allow_publish_for_subscriber: false
      allow_subscribe_for_client: false
