# ==============================================================================
# ZITADEL 统一身份认证与授权平台 (Identity & Access Management / ZITADEL)
# ==============================================================================
# 📦 镜像组件架构与职责说明：
#
# 1. zitadel-api (ghcr.io/zitadel/zitadel)
#    - 功能职责：ZITADEL 核心后端引擎 (Golang)。承载身份认证 (OIDC/OAuth2/SAML)、
#               权限授权、多租户管理、事件溯源 (Event Sourcing) 及 gRPC / REST API。
#    - 使用方式：作为 IAM 基础设施核心，负责数据库初始化/迁移、数据持久化与令牌签发。
#               通过 `start-from-init` 一键完成初始化并启动，对外提供管理控制台与认证接口，
#               由 Caddy 网关以 h2c 协议进行高性能反代。
#
# 2. zitadel-login (ghcr.io/zitadel/zitadel-login)
#    - 功能职责：现代化 Login V2 独立前端用户界面 (Next.js / React)。
#               自 ZITADEL v4 起从后端解耦独立发布，专职负责终端用户视觉与认证交互。
#    - 使用方式：承载用户登录、注册、MFA 多因子验证、重置密码等全套交互流程。
#               通过首次启动生成的机器服务账号令牌 (login-client.pat) 与 zitadel-api 通信，
#               在反代网关中路由至 `/ui/v2/login` 前缀，直接面向终端浏览器访问。
# ==============================================================================

services:
  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.17.2
    container_name: zitadel-api
    restart: always
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: zitadel.${SITE_ADDRESS}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"

      # 数据库连接：接入 backend 网络公共 PostgreSQL (提供开箱即用开发回退)
      ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/zitadel?sslmode=disable}

      # 首次初始化配置与 PAT 令牌生成 (供给 Login V2 UI 使用)
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      # Login V2 UI 路由端点与重定向
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://zitadel.${SITE_ADDRESS}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://zitadel.${SITE_ADDRESS}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://zitadel.${SITE_ADDRESS}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://zitadel.${SITE_ADDRESS}/ui/v2/login/login?samlRequest=

      # 访问日志标准输出
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"

    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/zitadel
        - ready
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - ${DATA_PATH}zitadel/bootstrap:/zitadel/bootstrap:rw
    networks:
      - frontend
      - backend

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.2
    container_name: zitadel-login
    restart: always
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:zitadel.${SITE_ADDRESS},X-Forwarded-Proto:https
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - ${DATA_PATH}zitadel/bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    networks:
      - frontend
      - backend
