services:
  infisical:
    container_name: infisical
    image: infisical/infisical:${INFISICAL_VERSION:-v0.165.15}
    restart: always
    ports:
      # ⚠ 宿主默认 80 与 Caddy 冲突，同时启用时请改 INFISICAL_PORT
      - "${INFISICAL_PORT:-80}:8080"
    environment:
      - NODE_ENV=production
      - TZ=${TIMEZONE:-Asia/Shanghai}
      # 密钥必须固定且保密，缺失会在启动前直接失败
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY:?请在 .env 设置 INFISICAL_ENCRYPTION_KEY（openssl rand -hex 16）}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET:?请在 .env 设置 INFISICAL_AUTH_SECRET（openssl rand -base64 32）}
      - DB_CONNECTION_URI=${INFISICAL_DB_CONNECTION_URI:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/infisical?sslmode=disable}
      - REDIS_URL=${INFISICAL_REDIS_URL:-redis://:${REDIS_PASSWORD}@valkey:6379/6}   # 库号 6 避开 0/3
      - SITE_URL=${INFISICAL_SITE_URL:-http://localhost:${INFISICAL_PORT:-80}}
    depends_on:
      - postgres
      - valkey
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
