# ==============================================================================
# Casdoor 核心配置文件 (Casdoor Configuration)
# 官方参考: https://casdoor.org/docs/basic/server-configuration
# ==============================================================================

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true

# 数据库连接 (PostgreSQL)
driverName = postgres
dataSourceName = "user=postgres password=598f18a1c99d539ced6631add2b428b3 host=postgres port=5432 sslmode=disable dbname=casdoor"
dbName = casdoor
tableNamePrefix =
showSql = false

# 缓存与存储配置 (默认内存缓存)
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false

# 认证与安全配置
authState = "casdoor"
socks5Proxy = ""
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "zh"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =

# 协议服务端口
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"

# 配额与日志策略
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}

# 初始化数据引导
initDataNewOnly = false
initDataFile = "./init_data.json"
frontendBaseDir = "../cc_0"
