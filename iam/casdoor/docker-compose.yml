services:
  casdoor:
    image: casbin/casdoor:4.2.0
    container_name: casdoor
    restart: always
    ports:
      - "${CASDOOR_PORT:-8300}:8000"
    environment:
      - GIN_MODE=release
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./conf:/conf
      - ${LOG_PATH}casdoor:/logs
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

