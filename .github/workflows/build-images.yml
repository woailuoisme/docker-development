name: Build Images

on:
  workflow_dispatch:
    inputs:
      build_caddy_base:
        description: "Build caddy-base (2.11, latest)"
        type: boolean
        default: false
      build_postgres:
        description: "Build postgres (18-trixie)"
        type: boolean
        default: false
      build_postgres_alpine:
        description: "Build postgres-alpine (18-alpine)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_GHCR: ghcr.io/woailuoisme

jobs:
  matrix-builder:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'

          add_task() {
            local name="$1"
            local context="$2"
            local image="$3"
            local versions="$4"
            local tags=""

            IFS=',' read -ra V_ARR <<< "$versions"
            for v in "${V_ARR[@]}"; do
              tags+="${REGISTRY_DOCKERHUB}/${image}:${v},${REGISTRY_GHCR}/${image}:${v},"
            done
            tags="${tags%,}"

            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c \
              --arg name "$name" \
              --arg context "$context" \
              --arg tags "$tags" \
              '. + [{"name": $name, "context": $context, "tags": $tags}]')
          }

          [[ "${{ inputs.build_caddy_base }}" == "true" ]] && add_task "caddy-base" "./gateways/caddy-base" "caddy-base" "2.11,latest"
          [[ "${{ inputs.build_postgres }}" == "true" ]] && add_task "postgres" "./database/postgres" "postgres" "18-trixie"
          [[ "${{ inputs.build_postgres_alpine }}" == "true" ]] && add_task "postgres-alpine" "./database/postgres-alpine" "postgres" "18-alpine"

          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}

    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CHANGE_SOURCE=false
            CHINA=false
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
