name: Build Images

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build all"
        type: boolean
        default: false
      build_caddy_base:
        description: "Build caddy-base"
        type: boolean
        default: false
      build_postgres:
        description: "Build postgres"
        type: boolean
        default: false

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'

          add_task() {
            local name="$1"
            local context="$2"
            local image="$3"
            local version="$4"
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c \
              --arg name "$name" \
              --arg context "$context" \
              --arg image "$image" \
              --arg version "$version" \
              '. + [{"name": $name, "context": $context, "image": $image, "version": $version}]')
          }

          BUILD_ALL=${{ inputs.build_all }}
          BUILD_CADDY=${{ inputs.build_caddy_base }}
          BUILD_PG=${{ inputs.build_postgres }}

          # Default to building all if nothing is specifically selected
          if [[ "$BUILD_ALL" != "true" && "$BUILD_CADDY" != "true" && "$BUILD_PG" != "true" ]]; then
            BUILD_ALL="true"
          fi

          [[ "$BUILD_ALL" == "true" || "$BUILD_CADDY" == "true" ]] && add_task "caddy-base" "./gateways/caddy-base" "caddy-base" "2.11"
          [[ "$BUILD_ALL" == "true" || "$BUILD_PG" == "true" ]] && add_task "postgres" "./database/postgres-18" "postgres" "18"

          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}

    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CHANGE_SOURCE=false
            CHINA=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:${{ matrix.version }}
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:${{ matrix.version }}
