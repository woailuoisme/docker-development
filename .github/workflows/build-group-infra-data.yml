name: Build Group - Infra Data
on:
  workflow_dispatch:
    inputs:
      build_all:
        description: '构建所有数据服务'
        type: boolean
        default: false
      build_minio:
        description: '构建 MinIO'
        type: boolean
        default: false
      build_rabbitmq:
        description: '构建 RabbitMQ'
        type: boolean
        default: false
      build_meilisearch:
        description: '构建 Meilisearch'
        type: boolean
        default: false
      build_pgbouncer:
        description: '构建 PgBouncer'
        type: boolean
        default: false
      build_pgbouncer_alpine:
        description: '构建 PgBouncer (Alpine)'
        type: boolean
        default: false
      build_garage:
        description: '构建 Garage'
        type: boolean
        default: false
      build_mosquitto:
        description: '构建 Mosquitto (MQTT)'
        type: boolean
        default: false
      build_centrifugo:
        description: '构建 Centrifugo'
        type: boolean
        default: false

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'
          add_task() {
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ". + [{\"name\": \"$1\", \"context\": \"$2\", \"image\": \"$3\"}]")
          }
          BUILD_ALL=${{ inputs.build_all }}
          
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_minio }}" == "true" ]] && add_task "minio" "./minio" "minio"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_rabbitmq }}" == "true" ]] && add_task "rabbitmq" "./rabbitmq" "rabbitmq"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_meilisearch }}" == "true" ]] && add_task "meilisearch" "./meilisearch" "meilisearch"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_pgbouncer }}" == "true" ]] && add_task "pgbouncer" "./pgbouncer" "pgbouncer"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_pgbouncer_alpine }}" == "true" ]] && add_task "pgbouncer-alpine" "./pgbouncer-alpine" "pgbouncer-alpine"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_garage }}" == "true" ]] && add_task "garage" "./garage" "garage"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_mosquitto }}" == "true" ]] && add_task "mosquitto" "./mosquitto" "mosquitto"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_centrifugo }}" == "true" ]] && add_task "centrifugo" "./centrifugo" "centrifugo"
          
          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CHANGE_SOURCE=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:latest
