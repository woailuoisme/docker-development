name: Build Group - PHP Services

on:
  workflow_dispatch:
    inputs:
      # === 控制开关 ===
      build_all:
        description: '🚀 构建所有 PHP 服务'
        type: boolean
        default: false
      
      build_php_fpm:
        description: '构建 PHP-FPM'
        type: boolean
        default: false
      build_php_franken:
        description: '构建 PHP-Franken'
        type: boolean
        default: false
      build_php_horizon:
        description: '构建 PHP-Horizon'
        type: boolean
        default: false
      build_php_roadrunner:
        description: '构建 PHP-RoadRunner'
        type: boolean
        default: false
      build_php_reverb:
        description: '构建 PHP-Reverb'
        type: boolean
        default: false
      build_php_schedule:
        description: '构建 PHP-Schedule'
        type: boolean
        default: false
      
      php_version:
        description: 'PHP 基础版本 (默认: 8.5)'
        required: false
        default: '8.5'

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'
          
          add_task() {
            local name="$1"
            local context="$2"
            local image="$3"
            local type="$4"
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ". + [{\"name\": \"$name\", \"context\": \"$context\", \"image\": \"$image\", \"type\": \"$type\"}]")
          }
          
          BUILD_ALL=${{ inputs.build_all }}
          
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_php_fpm }}" == "true" ]] && add_task "php-fpm" "./php-fpm" "php-fpm" "fpm"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_php_franken }}" == "true" ]] && add_task "php-franken" "./php-franken" "php-franken" "franken"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_php_horizon }}" == "true" ]] && add_task "php-horizon" "./php-horizon" "php-horizon" "horizon"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_php_roadrunner }}" == "true" ]] && add_task "php-roadrunner" "./php-roadrunner" "php-roadrunner" "roadrunner"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_php_reverb }}" == "true" ]] && add_task "php-reverb" "./php-reverb" "php-reverb" "reverb"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_php_schedule }}" == "true" ]] && add_task "php-schedule" "./php-schedule" "php-schedule" "schedule"
          
          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build-php:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    
    name: Build ${{ matrix.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_VERSION=${{ inputs.php_version }}
            CHANGE_SOURCE=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:${{ inputs.php_version }}
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:${{ inputs.php_version }}
