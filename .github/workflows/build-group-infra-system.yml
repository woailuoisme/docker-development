name: Build Group - Infra System
on:
  workflow_dispatch:
    inputs:
      build_all:
        description: '🚀 构建所有系统服务'
        type: boolean
        default: false
      build_authelia:
        description: '构建 Authelia'
        type: boolean
        default: false
      build_beszel:
        description: '构建 Beszel'
        type: boolean
        default: false
      build_beszel_agent:
        description: '构建 Beszel Agent'
        type: boolean
        default: false
      build_arcane:
        description: '构建 Arcane'
        type: boolean
        default: false
      build_telegraf:
        description: '构建 Telegraf'
        type: boolean
        default: false
      build_docker_socket_proxy:
        description: '构建 Docker Socket Proxy'
        type: boolean
        default: false
      build_grafana:
        description: '构建 Grafana'
        type: boolean
        default: false
      build_prometheus:
        description: '构建 Prometheus'
        type: boolean
        default: false
      build_dnsmasq:
        description: '构建 Dnsmasq'
        type: boolean
        default: false
      build_restic:
        description: '构建 Restic'
        type: boolean
        default: false
      build_pocketbase:
        description: '构建 PocketBase'
        type: boolean
        default: false

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'
          add_task() {
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ". + [{\"name\": \"$1\", \"context\": \"$2\", \"image\": \"$3\"}]")
          }
          BUILD_ALL=${{ inputs.build_all }}
          
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_authelia }}" == "true" ]] && add_task "authelia" "./authelia" "authelia"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_beszel }}" == "true" ]] && add_task "beszel" "./beszel" "beszel"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_beszel_agent }}" == "true" ]] && add_task "beszel-agent" "./beszel-agent" "beszel-agent"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_arcane }}" == "true" ]] && add_task "arcane" "./arcane" "arcane"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_telegraf }}" == "true" ]] && add_task "telegraf" "./telegraf" "telegraf"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_docker_socket_proxy }}" == "true" ]] && add_task "docker-socket-proxy" "./docker-socket-proxy" "docker-socket-proxy"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_grafana }}" == "true" ]] && add_task "grafana" "./grafana" "grafana"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_prometheus }}" == "true" ]] && add_task "prometheus" "./prometheus" "prometheus"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_dnsmasq }}" == "true" ]] && add_task "dnsmasq" "./dnsmasq" "dnsmasq"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_restic }}" == "true" ]] && add_task "restic" "./restic" "restic"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_pocketbase }}" == "true" ]] && add_task "pocketbase" "./pocketbase" "pocketbase"
          
          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CHANGE_SOURCE=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:latest
