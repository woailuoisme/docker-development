name: Build Group - Infra Web
on:
  workflow_dispatch:
    inputs:
      build_all:
        description: '🚀 构建所有 Web 服务'
        type: boolean
        default: false
      build_caddy:
        description: '构建 Caddy'
        type: boolean
        default: false
      build_nginx_base_alpine:
        description: '构建 Nginx Base (Alpine)'
        type: boolean
        default: false
      build_nginx:
        description: '构建 Nginx'
        type: boolean
        default: false
      build_nginx_simple:
        description: '构建 Nginx Simple'
        type: boolean
        default: false
      build_openresty:
        description: '构建 OpenResty'
        type: boolean
        default: false
      build_acme:
        description: '构建 acme.sh'
        type: boolean
        default: false
      build_goaccess:
        description: '构建 GoAccess'
        type: boolean
        default: false
      build_website:
        description: '构建 Website'
        type: boolean
        default: false
      build_wordpress:
        description: '构建 WordPress'
        type: boolean
        default: false

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'
          add_task() {
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c ". + [{\"name\": \"$1\", \"context\": \"$2\", \"image\": \"$3\"}]")
          }
          BUILD_ALL=${{ inputs.build_all }}
          
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_caddy }}" == "true" ]] && add_task "caddy" "./caddy" "caddy"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_nginx_base_alpine }}" == "true" ]] && add_task "nginx-base-alpine" "./nginx-base-alpine" "nginx-base-alpine"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_nginx }}" == "true" ]] && add_task "nginx" "./nginx" "nginx"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_nginx_simple }}" == "true" ]] && add_task "nginx-simple" "./nginx-simple" "nginx-simple"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_openresty }}" == "true" ]] && add_task "openresty" "./openresty" "openresty"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_acme }}" == "true" ]] && add_task "acme" "./acme" "acme"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_goaccess }}" == "true" ]] && add_task "goaccess" "./go-access" "goaccess"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_website }}" == "true" ]] && add_task "website" "./website" "website"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_wordpress }}" == "true" ]] && add_task "wordpress" "./wordpress" "wordpress"
          
          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CHANGE_SOURCE=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:latest
