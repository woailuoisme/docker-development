name: Build Group - Database Services

on:
  workflow_dispatch:
    inputs:
      # === 控制开关 ===
      build_all:
        description: '🚀 构建所有数据库服务'
        type: boolean
        default: false
      
      build_mysql:
        description: '构建 mysql'
        type: boolean
        default: false
      build_mongodb:
        description: '构建 MongoDB'
        type: boolean
        default: false
      build_redis:
        description: '构建 Redis'
        type: boolean
        default: false
      build_valkey:
        description: '构建 Valkey'
        type: boolean
        default: false
      build_postgres_17_trixie:
        description: '构建 PostgreSQL 17 (Trixie)'
        type: boolean
        default: false
      build_postgres_18_trixie:
        description: '构建 PostgreSQL 18 (Trixie)'
        type: boolean
        default: false
      build_postgres_18_no_tsdb:
        description: '构建 PostgreSQL 18 (No-TSDB)'
        type: boolean
        default: false
      
      # === 通用参数 ===
      tag:
        description: '镜像标签 (e.g., latest)'
        required: true
        default: 'latest'

      # === 版本参数 ===
      mysql_version:
        description: 'MySQL 版本'
        required: false
        default: '8.4.8'
      mongo_version:
        description: 'MongoDB 版本'
        required: false
        default: '8.2.5'
      redis_version:
        description: 'Redis 版本'
        required: false
        default: '8.6.1-trixie'
      valkey_version:
        description: 'Valkey 版本'
        required: false
        default: '9.0.3-trixie'
      postgres17_trixie_version:
        description: 'PostgreSQL 17 Trixie 版本'
        required: false
        default: '17.9-trixie'
      postgres18_trixie_version:
        description: 'PostgreSQL 18 Trixie 版本'
        required: false
        default: '18.3-trixie'
      postgres18_no_tsdb_version:
        description: 'PostgreSQL 18 No-TSDB 版本'
        required: false
        default: '18.3-trixie'

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'
          
          add_task() {
            local name=$1
            local context=$2
            local image=$3
            local version=$4
            MATRIX_JSON=$(echo $MATRIX_JSON | jq -c ". + [{\"name\": \"$name\", \"context\": \"$context\", \"image\": \"$image\", \"version\": \"$version\"}]")
          }
          
          BUILD_ALL=${{ inputs.build_all }}
          
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_mysql }}" == "true" ]] && add_task "mysql" "./mysql-8" "mysql" "${{ inputs.mysql_version }}"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_mongodb }}" == "true" ]] && add_task "mongodb" "./mongodb" "mongodb" "${{ inputs.mongo_version }}"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_redis }}" == "true" ]] && add_task "redis" "./redis" "redis" "${{ inputs.redis_version }}"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_valkey }}" == "true" ]] && add_task "valkey" "./valkey" "valkey" "${{ inputs.valkey_version }}"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_17_trixie }}" == "true" ]] && add_task "postgres-17-trixie" "./postgres-trixie-17" "postgres" "${{ inputs.postgres17_trixie_version }}"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_18_trixie }}" == "true" ]] && add_task "postgres-18-trixie" "./postgres-trixie-18" "postgres" "${{ inputs.postgres18_trixie_version }}"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_18_no_tsdb }}" == "true" ]] && add_task "postgres-18-no-tsdb" "./postgres-trixie-18-no-tsdb" "postgres-no-tsdb" "${{ inputs.postgres18_no_tsdb_version }}"

          
          echo "matrix={\"include\":$MATRIX_JSON}" >> $GITHUB_OUTPUT

  build-database:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    
    name: Build ${{ matrix.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
             MYSQL_VERSION=${{ matrix.version }}
             MONGO_VERSION=${{ matrix.version }}
             REDIS_VERSION=${{ matrix.version }}
             VALKEY_VERSION=${{ matrix.version }}
             POSTGRES_VERSION=${{ matrix.version }}
             CHANGE_SOURCE=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:${{ matrix.version }}-${{ inputs.tag }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:${{ matrix.version }}
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:${{ matrix.version }}-${{ inputs.tag }}
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:${{ matrix.version }}
