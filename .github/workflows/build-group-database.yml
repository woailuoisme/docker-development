name: Build Group - Database Services

on:
  workflow_dispatch:
    inputs:
      # === 控制开关 ===
      build_all:
        description: '🚀 构建所有数据库服务'
        type: boolean
        default: false
      
      build_mysql:
        description: '构建 mysql'
        type: boolean
        default: false
      build_mongodb:
        description: '构建 MongoDB'
        type: boolean
        default: false
      build_redis:
        description: '构建 Redis'
        type: boolean
        default: false
      build_valkey:
        description: '构建 Valkey'
        type: boolean
        default: false
      build_postgres_17_trixie:
        description: '构建 PostgreSQL 17 (Trixie)'
        type: boolean
        default: false
      build_postgres_18_trixie:
        description: '构建 PostgreSQL 18 (Trixie)'
        type: boolean
        default: false
      build_postgres_18_no_tsdb:
        description: '构建 PostgreSQL 18 (No-TSDB)'
        type: boolean
        default: false
      
      build_postgres_18_alpine:
        description: '构建 PostgreSQL 18 (Alpine)'
        type: boolean
        default: false
      

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  REGISTRY_REDHAT: quay.io/jiaoio

jobs:
  matrix-builder:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='[]'
          
          add_task() {
            local name=$1
            local context=$2
            local image=$3
            MATRIX_JSON=$(echo $MATRIX_JSON | jq -c ". + [{\"name\": \"$name\", \"context\": \"$context\", \"image\": \"$image\"}]")
          }
          
          BUILD_ALL=${{ inputs.build_all }}
          
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_mysql }}" == "true" ]] && add_task "mysql" "./mysql-8" "mysql"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_mongodb }}" == "true" ]] && add_task "mongodb" "./mongodb" "mongodb"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_redis }}" == "true" ]] && add_task "redis" "./redis" "redis"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_valkey }}" == "true" ]] && add_task "valkey" "./valkey" "valkey"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_17_trixie }}" == "true" ]] && add_task "postgres-17-trixie" "./postgres-trixie-17" "postgres"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_18_trixie }}" == "true" ]] && add_task "postgres-18-trixie" "./postgres-18-trixie" "postgres"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_18_no_tsdb }}" == "true" ]] && add_task "postgres-18-no-tsdb" "./postgres-trixie-18-no-tsdb" "postgres-no-tsdb"
          [[ "$BUILD_ALL" == "true" || "${{ inputs.build_postgres_18_alpine }}" == "true" ]] && add_task "postgres-18-alpine" "./postgres-18-alpine" "postgres"

          
          echo "matrix={\"include\":$MATRIX_JSON}" >> $GITHUB_OUTPUT

  build-database:
    needs: matrix-builder
    if: ${{ fromJson(needs.matrix-builder.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-builder.outputs.matrix) }}
    
    name: Build ${{ matrix.name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registries
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.REDHAT_REGISTRY_TOKEN }}" | docker login quay.io -u "${{ secrets.REDHAT_REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
             CHANGE_SOURCE=false
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY_REDHAT }}/${{ matrix.image }}:latest
