services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.4.11-slim
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "18789:18789" # Web 管理界面
      - "18790:18790" # 插件服务端口
    volumes:
      - ./data:/root/.openclaw   # 存储 API Key、插件和聊天记录
      - /var/run/docker.sock:/var/run/docker.sock # 允许 Agent 运行代码沙箱
    environment:
      - TZ=Asia/Shanghai
      # 如果你需要通过宿主机的代理软件科学上网，请设置：
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
    # 针对 Apple Silicon M2 的性能优化
    deploy:
      resources:
        limits:
          memory: 4G