user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /var/run/nginx.pid;
daemon off;
worker_rlimit_nofile 65535;

# Dynamic Modules
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;

events {
    worker_connections 20480;
    multi_accept on;
    use epoll;
    accept_mutex off;
}

stream {
    include /etc/nginx/snippets/stream.conf;
}

http {
    # WebSocket Map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Core Settings
    include /etc/nginx/snippets/http-core.conf;

    # Logging
    include /etc/nginx/snippets/logging.conf;

    # Compression (Gzip, Brotli, Zstd)
    include /etc/nginx/snippets/compression.conf;

    # Security & Rate Limiting
    include /etc/nginx/snippets/anti-ddos.conf;

    # Default Server
    server {
        listen 80 default_server;
        server_name _;
        
        # SSL & Security Headers
        include /etc/nginx/snippets/ssl.conf;
    }

    # Virtual Hosts
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-available/*.conf;
}
