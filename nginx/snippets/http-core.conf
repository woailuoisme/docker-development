# =========================================================
# 基础设置 (Basic Settings)
# =========================================================
charset UTF-8;
server_tokens off;
sendfile on;
tcp_nopush on;
tcp_nodelay on;
types_hash_max_size 2048;
include /etc/nginx/mime.types;
default_type application/octet-stream;

# =========================================================
# 超时与连接 (Timeouts & Connections)
# =========================================================
keepalive_timeout 65;      # 适中的保持时间
keepalive_requests 10000;  # 高并发下增加单连接请求数
reset_timedout_connection on; # 快速重置超时连接
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 15s;

# =========================================================
# 缓冲区优化 (Buffers)
# =========================================================
# 针对 1.29.x 优化
client_body_buffer_size 128k;
client_header_buffer_size 4k;      # 适配大型 Cookie/Header
large_client_header_buffers 4 32k;
client_max_body_size 100M;         # 提升默认上传大小
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

# =========================================================
# DNS 解析 (Resolver)
# =========================================================
resolver 127.0.0.11 valid=30s;  # Docker 内部 DNS
resolver_timeout 10s;

# =========================================================
# 文件缓存 (Open File Cache)
# =========================================================
open_file_cache max=10000 idle_timeout=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;


# =========================================================
# SSL 全局设置 (SSL Global)
# =========================================================
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off; # TLS 1.3 推荐由浏览器选择最优算法
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets on;
ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

