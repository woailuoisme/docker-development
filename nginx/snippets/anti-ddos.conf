# HTTP 访问频率限制与 Anti-DDoS 优化配置
# =========================================================
# 核心原理：使用 Nginx 的漏桶算法 (Leaky Bucket) 平滑请求流量
# 内存说明：zone=name:10m 表示开辟 10MB 内存存储 IP 状态 (约可记录 16 万个 IP)
# 使用指南：需在 location 或 server 块中通过 limit_req 指令启用
# =========================================================

# ---------------------------------------------------------
# 1. 关键业务防护 (Login/Register/SMS)
# ---------------------------------------------------------
# 场景：登录、注册、发送短信验证码、重置密码
# 策略：极低频限制，严防暴力破解和短信接口被刷
# 速率：5r/m (平均 12 秒 1 次请求)
limit_req_zone $binary_remote_addr zone=limit_auth:10m rate=5r/m;

# ---------------------------------------------------------
# 2. 核心事务防护 (Order/Pay/Search)
# ---------------------------------------------------------
# 场景：下单、支付、复杂的搜索查询、数据导出
# 策略：低频限制，防止数据库高负载
# 速率：2r/s (每秒 2 次)
limit_req_zone $binary_remote_addr zone=limit_transaction:10m rate=2r/s;

# ---------------------------------------------------------
# 3. 通用 API 防护 (General API)
# ---------------------------------------------------------
# 场景：常规 REST API、列表加载、详情页数据
# 策略：中等频率，满足前端并发加载需求
# 速率：20r/s (每秒 20 次，配合 burst 可应对瞬间高并发)
limit_req_zone $binary_remote_addr zone=limit_api:10m rate=20r/s;

# ---------------------------------------------------------
# 4. 静态资源与全局防护 (Global/Static)
# ---------------------------------------------------------
# 场景：全站基础防护、静态文件访问
# 策略：高频宽松限制，主要防止恶意的高频刷新脚本
# 速率：100r/s (每秒 100 次)
limit_req_zone $binary_remote_addr zone=limit_global:10m rate=100r/s;

# ---------------------------------------------------------
# 5. 爬虫与机器人限制 (Anti-Crawler)
# ---------------------------------------------------------
# 识别逻辑：通过 User-Agent 标记已知爬虫
map $http_user_agent $is_crawler {
    default 0;
    ~*(bot|crawler|spider|scraper|slurp|bingbot|bytespider) 1;
}
# 策略：限制爬虫抓取频率，节省带宽和 CPU
# 速率：1r/s (每秒 1 次)
limit_req_zone $is_crawler zone=limit_crawler:10m rate=1r/s;

# ---------------------------------------------------------
# 6. 并发连接数限制 (Anti-Slowloris)
# ---------------------------------------------------------
# 场景：限制单个 IP 的 TCP 连接数
# 策略：防止慢速连接耗尽服务器 worker 资源
limit_conn_zone $binary_remote_addr zone=limit_conn:10m;


# =========================================================
