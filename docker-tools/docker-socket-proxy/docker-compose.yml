services:
  docker-socket-proxy:
    build:
      context: .
      args:
        - SOCKET_PROXY_VERSION=${SOCKET_PROXY_VERSION:-3.2.18}
    container_name: docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    ports:
      - "42375:2375"
    # 安全配置：防止容器提权，增强生产环境安全性
    security_opt:
      - no-new-privileges:true
    # 开启只读文件系统，防止运行时修改容器内容
    read_only: true
    # 使用 tmpfs 将临时目录挂载到内存，解决只读模式下的写入需求（如 HAProxy 配置文件生成）
    tmpfs:
      - /run
      - /tmp
    networks:
      - backend
      - frontend
