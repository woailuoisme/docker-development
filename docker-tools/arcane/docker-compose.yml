services:
  arcane:
    image: quay.io/getarcaneapp/manager:latest
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}arcane:/app/data
    environment:
      - ENCRYPTION_KEY=TtQR8Lsn8ltqxC8OeUD127FsVvg7fW2GihUzSnBO/zQ=
      - TZ=Asia/Shanghai
    cgroup: host
    restart: unless-stopped
    networks:
      - frontend
      - backend
