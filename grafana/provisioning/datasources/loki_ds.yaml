apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 5000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "(?:trace_id|traceId|traceID|tid)[=\": ]+([0-9a-fA-F]{32})"
          name: TraceID
          url: "$${__value.raw}"
