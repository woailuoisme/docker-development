networks:
  backend:
    name: backend
    external: ${NETWORK_EXTERNAL:-false}

services:
  adminer:
    image: adminer:${ADMINER_VERSION:-5.5.0}
    container_name: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-18080}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=${ADMINER_DEFAULT_SERVER:-postgres}
      - ADMINER_DESIGN=${ADMINER_DESIGN:-pepa-linha-dark}
      - ADMINER_PLUGINS=${ADMINER_PLUGINS:-tables-filter dump-zip dump-json enum-option edit-textarea}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    networks:
      - backend
